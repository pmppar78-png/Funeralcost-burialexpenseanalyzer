[build]
  publish = "."
  command = "node generate-pages.js"

[functions]
  directory = "netlify/functions"

# ─── Security & Performance Headers ───────────────────────────────

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.google-analytics.com https://www.googletagmanager.com; connect-src 'self' https://api.openai.com https://www.google-analytics.com https://analytics.google.com https://www.googletagmanager.com"

# ─── Cache static assets aggressively ─────────────────────────────

[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/script.js"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/sitemap-*.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ─── HTML pages — cache briefly, revalidate; confirm indexability ─

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
    X-Robots-Tag = "index, follow"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
    X-Robots-Tag = "index, follow"

# 404 page must not be indexed — override the generic /*.html rule above
[[headers]]
  for = "/404.html"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

# ─── Block public access to build-time artifacts ─────────────────
# The build command runs node generate-pages.js, and publish = "." includes
# the generator in the deploy. Serve a 404 for the file itself.

[[redirects]]
  from = "/generate-pages.js"
  to = "/404.html"
  status = 404
  force = true

# ─── Domain-level redirects (one-hop, no chains) ─────────────────
# Canonical host: https://funeralcostanalyzer.com (non-www, HTTPS, no trailing slash except root)

# www → non-www (HTTPS is forced by Netlify automatically)
[[redirects]]
  from = "https://www.funeralcostanalyzer.com/*"
  to = "https://funeralcostanalyzer.com/:splat"
  status = 301
  force = true

# Netlify subdomain → canonical domain
[[redirects]]
  from = "https://funeralcostanalyzer.netlify.app/*"
  to = "https://funeralcostanalyzer.com/:splat"
  status = 301
  force = true

