name: content-quality

on:
  push:
  pull_request:

jobs:
  repeated-sentences:
    name: No sentence on 5 or more pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check repeated sentences
        run: node scripts/check-repeated-sentences.js
