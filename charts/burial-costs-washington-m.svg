<rect width="360" height="398" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#2b2b2b">
<text x="16" y="26" font-size="16" font-weight="700">Washington burial estimates, 2026</text>
<text x="16" y="54">Funeral service</text><rect x="16" y="62" width="218" height="16" rx="3" fill="#8a6d3b"/><text x="240" y="75" font-weight="600">$8,800</text>
<text x="16" y="104">Cemetery plot</text><rect x="16" y="112" width="104" height="16" rx="3" fill="#8a6d3b"/><text x="126" y="125" font-weight="600">$4,200</text>
