<svg xmlns="http://www.w3.org/2000/svg" width="360" height="442" viewBox="0 0 360 442" role="img" aria-labelledby="t d">
<title id="t">Rhode Island burial costs, 2026 estimates</title>
<desc id="d">Horizontal bar chart of Rhode Island burial costs, 2026 estimates. Funeral service $9,000; Cemetery plot $4,400; Casket $2,700; Burial vault / liner $1,760; Opening &amp; closing grave $2,200; Headstone / marker $1,500; Embalming $900.</desc>
<rect width="360" height="442" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#2b2b2b">
<text x="16" y="26" font-size="16" font-weight="700">Rhode Island burial costs, 2026</text>
<text x="16" y="48" font-size="16" font-weight="700">estimates</text>
<text x="16" y="76">Funeral service</text><text x="344" y="76" text-anchor="end" font-weight="600">$9,000</text><rect x="16" y="82" width="328" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="128">Cemetery plot</text><text x="344" y="128" text-anchor="end" font-weight="600">$4,400</text><rect x="16" y="134" width="160" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="180">Casket</text><text x="344" y="180" text-anchor="end" font-weight="600">$2,700</text><rect x="16" y="186" width="98" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="232">Burial vault / liner</text><text x="344" y="232" text-anchor="end" font-weight="600">$1,760</text><rect x="16" y="238" width="64" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="284">Opening &amp; closing grave</text><text x="344" y="284" text-anchor="end" font-weight="600">$2,200</text><rect x="16" y="290" width="80" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="336">Headstone / marker</text><text x="344" y="336" text-anchor="end" font-weight="600">$1,500</text><rect x="16" y="342" width="55" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="388">Embalming</text><text x="344" y="388" text-anchor="end" font-weight="600">$900</text><rect x="16" y="394" width="33" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="438" font-size="11" fill="#6b5a4a">$0</text><text x="344" y="438" font-size="11" fill="#6b5a4a" text-anchor="end">$9,000</text>
</g>
</svg>
