<svg xmlns="http://www.w3.org/2000/svg" width="360" height="390" viewBox="0 0 360 390" role="img" aria-labelledby="t d">
<title id="t">Hawaii cremation cost estimates, 2026</title>
<desc id="d">Range chart of Hawaii cremation cost estimates, 2026. Direct cremation $2,100 to $4,200; Cremation with service $6,560 to $10,660; Basic urn $25 to $3,000 or more; Memorial service $0 to $5,000; Cremation jewelry $20 to $2,000 or more; Scattering service $0 to $1,500.</desc>
<rect width="360" height="390" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#2b2b2b">
<text x="16" y="26" font-size="16" font-weight="700">Hawaii cremation cost estimates,</text>
<text x="16" y="48" font-size="16" font-weight="700">2026</text>
<text x="16" y="76">Direct cremation</text><text x="344" y="76" text-anchor="end" font-weight="600">$2,100–$4,200</text><rect x="16" y="86" width="328" height="12" rx="3" fill="#efe7db"/><rect x="81" y="82" width="64" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="128">Cremation with service</text><text x="344" y="128" text-anchor="end" font-weight="600">$6,560–$10,660</text><rect x="16" y="138" width="328" height="12" rx="3" fill="#efe7db"/><rect x="218" y="134" width="126" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="180">Basic urn</text><text x="344" y="180" text-anchor="end" font-weight="600">$25–$3,000+</text><rect x="16" y="190" width="328" height="12" rx="3" fill="#efe7db"/><rect x="17" y="186" width="91" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="232">Memorial service</text><text x="344" y="232" text-anchor="end" font-weight="600">$0–$5,000</text><rect x="16" y="242" width="328" height="12" rx="3" fill="#efe7db"/><rect x="16" y="238" width="154" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="284">Cremation jewelry</text><text x="344" y="284" text-anchor="end" font-weight="600">$20–$2,000+</text><rect x="16" y="294" width="328" height="12" rx="3" fill="#efe7db"/><rect x="17" y="290" width="61" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="336">Scattering service</text><text x="344" y="336" text-anchor="end" font-weight="600">$0–$1,500</text><rect x="16" y="346" width="328" height="12" rx="3" fill="#efe7db"/><rect x="16" y="342" width="46" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="386" font-size="11" fill="#6b5a4a">$0</text><text x="344" y="386" font-size="11" fill="#6b5a4a" text-anchor="end">$10,660</text>
</g>
</svg>
