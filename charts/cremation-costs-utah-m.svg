<svg xmlns="http://www.w3.org/2000/svg" width="360" height="348" viewBox="0 0 360 348" role="img" aria-labelledby="t d">
<title id="t">Utah cremation estimates for 2026</title>
<desc id="d">Range chart of Utah cremation estimates for 2026. Direct cremation $1,120 to $2,240; Cremation with service $4,480 to $7,280; Basic urn $25 to $3,000 or more; Memorial service $0 to $5,000; Cremation jewelry $20 to $2,000 or more; Scattering service $0 to $1,500.</desc>
<rect width="360" height="348" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#2b2b2b">
<text x="16" y="26" font-size="16" font-weight="700">Utah cremation estimates for 2026</text>
<text x="16" y="54">Direct cremation</text><rect x="50" y="62" width="33" height="16" rx="3" fill="#8a6d3b"/><text x="89" y="75" font-weight="600">$1,120–$2,240</text>
<text x="16" y="104">Cremation with service</text><rect x="150" y="112" width="84" height="16" rx="3" fill="#8a6d3b"/><text x="240" y="125" font-weight="600">$4,480–$7,280</text>
<text x="16" y="154">Basic urn</text><rect x="17" y="162" width="89" height="16" rx="3" fill="#8a6d3b"/><text x="112" y="175" font-weight="600">$25–$3,000+</text>
<text x="16" y="204">Memorial service</text><rect x="16" y="212" width="150" height="16" rx="3" fill="#8a6d3b"/><text x="172" y="225" font-weight="600">$0–$5,000</text>
<text x="16" y="254">Cremation jewelry</text><rect x="17" y="262" width="59" height="16" rx="3" fill="#8a6d3b"/><text x="82" y="275" font-weight="600">$20–$2,000+</text>
<text x="16" y="304">Scattering service</text><rect x="16" y="312" width="45" height="16" rx="3" fill="#8a6d3b"/><text x="67" y="325" font-weight="600">$0–$1,500</text>
</g>
</svg>
