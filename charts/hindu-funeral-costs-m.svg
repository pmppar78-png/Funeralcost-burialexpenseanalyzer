<svg xmlns="http://www.w3.org/2000/svg" width="360" height="470" viewBox="0 0 360 470" role="img" aria-labelledby="t d">
<title id="t">Hindu Funeral Cost Estimates (2026)</title>
<desc id="d">Range chart of Hindu Funeral Cost Estimates (2026). Body preparation and ritual washing $200 to $500; Cremation service $1,500 to $5,000; Flowers and garlands $200 to $800; Pandit / priest services $200 to $1,000; Funeral home facility $1,000 to $3,000; Ash scattering service $200 to $1,500; 13th day memorial ceremony $500 to $2,000; Urn (if needed temporarily) $50 to $500.</desc>
<rect width="360" height="470" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#2b2b2b">
<text x="16" y="26" font-size="16" font-weight="700">Hindu Funeral Cost Estimates</text>
<text x="16" y="48" font-size="16" font-weight="700">(2026)</text>
<text x="16" y="76">Body preparation and ritual washing</text><rect x="25" y="84" width="13" height="16" rx="3" fill="#8a6d3b"/><text x="44" y="97" font-weight="600">$200–$500</text>
<text x="16" y="126">Cremation service</text><rect x="81" y="134" width="153" height="16" rx="3" fill="#8a6d3b"/><text x="240" y="147" font-weight="600">$1,500–$5,000</text>
<text x="16" y="176">Flowers and garlands</text><rect x="25" y="184" width="26" height="16" rx="3" fill="#8a6d3b"/><text x="57" y="197" font-weight="600">$200–$800</text>
<text x="16" y="226">Pandit / priest services</text><rect x="25" y="234" width="35" height="16" rx="3" fill="#8a6d3b"/><text x="66" y="247" font-weight="600">$200–$1,000</text>
<text x="16" y="276">Funeral home facility</text><rect x="60" y="284" width="87" height="16" rx="3" fill="#8a6d3b"/><text x="153" y="297" font-weight="600">$1,000–$3,000</text>
<text x="16" y="326">Ash scattering service</text><rect x="25" y="334" width="56" height="16" rx="3" fill="#8a6d3b"/><text x="87" y="347" font-weight="600">$200–$1,500</text>
<text x="16" y="376">13th day memorial ceremony</text><rect x="38" y="384" width="65" height="16" rx="3" fill="#8a6d3b"/><text x="109" y="397" font-weight="600">$500–$2,000</text>
<text x="16" y="426">Urn (if needed temporarily)</text><rect x="18" y="434" width="20" height="16" rx="3" fill="#8a6d3b"/><text x="44" y="447" font-weight="600">$50–$500</text>
</g>
</svg>
