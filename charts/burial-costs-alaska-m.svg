<svg xmlns="http://www.w3.org/2000/svg" width="360" height="398" viewBox="0 0 360 398" role="img" aria-labelledby="t d">
<title id="t">Alaska burial estimates for 2026</title>
<desc id="d">Horizontal bar chart of Alaska burial estimates for 2026. Funeral service $9,800; Cemetery plot $4,500; Casket $2,940; Burial vault / liner $1,800; Opening &amp; closing grave $2,250; Headstone / marker $1,500; Embalming $980.</desc>
<rect width="360" height="398" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#2b2b2b">
<text x="16" y="26" font-size="16" font-weight="700">Alaska burial estimates for 2026</text>
<text x="16" y="54">Funeral service</text><rect x="16" y="62" width="218" height="16" rx="3" fill="#8a6d3b"/><text x="240" y="75" font-weight="600">$9,800</text>
<text x="16" y="104">Cemetery plot</text><rect x="16" y="112" width="100" height="16" rx="3" fill="#8a6d3b"/><text x="122" y="125" font-weight="600">$4,500</text>
<text x="16" y="154">Casket</text><rect x="16" y="162" width="65" height="16" rx="3" fill="#8a6d3b"/><text x="87" y="175" font-weight="600">$2,940</text>
<text x="16" y="204">Burial vault / liner</text><rect x="16" y="212" width="40" height="16" rx="3" fill="#8a6d3b"/><text x="62" y="225" font-weight="600">$1,800</text>
<text x="16" y="254">Opening &amp; closing grave</text><rect x="16" y="262" width="50" height="16" rx="3" fill="#8a6d3b"/><text x="72" y="275" font-weight="600">$2,250</text>
<text x="16" y="304">Headstone / marker</text><rect x="16" y="312" width="33" height="16" rx="3" fill="#8a6d3b"/><text x="55" y="325" font-weight="600">$1,500</text>
<text x="16" y="354">Embalming</text><rect x="16" y="362" width="22" height="16" rx="3" fill="#8a6d3b"/><text x="44" y="375" font-weight="600">$980</text>
</g>
</svg>
