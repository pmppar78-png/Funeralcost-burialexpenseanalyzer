<svg xmlns="http://www.w3.org/2000/svg" width="680" height="274" viewBox="0 0 680 274" role="img" aria-labelledby="t d">
<title id="t">Washington DC Funeral Cost Averages (2026)</title>
<desc id="d">Horizontal bar chart of Washington DC Funeral Cost Averages (2026). Traditional funeral $8,200; Funeral with cremation $6,400; Direct cremation $1,900; Cemetery plot $4,000; Embalming $820; Casket $2,460; Burial vault / liner $1,600.</desc>
<rect width="680" height="274" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="13" fill="#2b2b2b">
<text x="16" y="28" font-size="16" font-weight="700">Washington DC Funeral Cost Averages (2026)</text>
<line x1="230" y1="48" x2="230" y2="262" stroke="#bbbbbb"/>
<text x="222" y="67" text-anchor="end">Traditional funeral</text><rect x="230" y="53" width="314" height="20" rx="3" fill="#8a6d3b"/><text x="550" y="67">$8,200</text>
<text x="222" y="97" text-anchor="end">Funeral with cremation</text><rect x="230" y="83" width="245" height="20" rx="3" fill="#8a6d3b"/><text x="481" y="97">$6,400</text>
<text x="222" y="127" text-anchor="end">Direct cremation</text><rect x="230" y="113" width="73" height="20" rx="3" fill="#8a6d3b"/><text x="309" y="127">$1,900</text>
<text x="222" y="157" text-anchor="end">Cemetery plot</text><rect x="230" y="143" width="153" height="20" rx="3" fill="#8a6d3b"/><text x="389" y="157">$4,000</text>
<text x="222" y="187" text-anchor="end">Embalming</text><rect x="230" y="173" width="31" height="20" rx="3" fill="#8a6d3b"/><text x="267" y="187">$820</text>
<text x="222" y="217" text-anchor="end">Casket</text><rect x="230" y="203" width="94" height="20" rx="3" fill="#8a6d3b"/><text x="330" y="217">$2,460</text>
<text x="222" y="247" text-anchor="end">Burial vault / liner</text><rect x="230" y="233" width="61" height="20" rx="3" fill="#8a6d3b"/><text x="297" y="247">$1,600</text>
</g>
</svg>
