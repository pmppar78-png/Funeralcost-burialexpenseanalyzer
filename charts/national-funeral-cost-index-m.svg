<svg xmlns="http://www.w3.org/2000/svg" width="360" height="270" viewBox="0 0 360 270" role="img" aria-labelledby="t d">
<title id="t">Average Funeral Cost in the U.S. (2026 Index)</title>
<desc id="d">Horizontal bar chart of Average Funeral Cost in the U.S. (2026 Index). Traditional Funeral $7,736; Cremation with Service $6,072; Burial Plot $3,656; Direct Cremation $1,834.</desc>
<rect width="360" height="270" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#2b2b2b">
<text x="16" y="26" font-size="16" font-weight="700">Average Funeral Cost in the U.S.</text>
<text x="16" y="48" font-size="16" font-weight="700">(2026 Index)</text>
<text x="16" y="76">Traditional Funeral</text><rect x="16" y="84" width="218" height="16" rx="3" fill="#8a6d3b"/><text x="240" y="97" font-weight="600">$7,736</text>
<text x="16" y="126">Cremation with Service</text><rect x="16" y="134" width="171" height="16" rx="3" fill="#8a6d3b"/><text x="193" y="147" font-weight="600">$6,072</text>
<text x="16" y="176">Burial Plot</text><rect x="16" y="184" width="103" height="16" rx="3" fill="#8a6d3b"/><text x="125" y="197" font-weight="600">$3,656</text>
<text x="16" y="226">Direct Cremation</text><rect x="16" y="234" width="52" height="16" rx="3" fill="#8a6d3b"/><text x="74" y="247" font-weight="600">$1,834</text>
</g>
</svg>
