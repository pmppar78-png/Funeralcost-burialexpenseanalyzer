<svg xmlns="http://www.w3.org/2000/svg" width="360" height="286" viewBox="0 0 360 286" role="img" aria-labelledby="t d">
<title id="t">Average Funeral Cost in the U.S. (2026 Index)</title>
<desc id="d">Horizontal bar chart of Average Funeral Cost in the U.S. (2026 Index). Traditional Funeral $7,736; Cremation with Service $6,072; Burial Plot $3,656; Direct Cremation $1,834.</desc>
<rect width="360" height="286" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#2b2b2b">
<text x="16" y="26" font-size="16" font-weight="700">Average Funeral Cost in the U.S.</text>
<text x="16" y="48" font-size="16" font-weight="700">(2026 Index)</text>
<text x="16" y="76">Traditional Funeral</text><text x="344" y="76" text-anchor="end" font-weight="600">$7,736</text><rect x="16" y="82" width="328" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="128">Cremation with Service</text><text x="344" y="128" text-anchor="end" font-weight="600">$6,072</text><rect x="16" y="134" width="257" height="16" rx="3" fill="#8a6d3b"/>
