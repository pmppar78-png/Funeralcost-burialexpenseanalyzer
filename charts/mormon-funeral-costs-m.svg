<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="t d">
<title id="t">LDS / Mormon Funeral Cost Estimates (2026)</title>
<desc id="d">Range chart of LDS / Mormon Funeral Cost Estimates (2026). Funeral home services $4,000 to $8,000; Temple clothing $50 to $200; Casket $1,000 to $5,000; Cemetery plot $1,000 to $5,000; Burial vault $800 to $4,000; Headstone / marker $1,000 to $3,000; Flowers and programs $200 to $800.</desc>
<rect width="360" height="420" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#2b2b2b">
<text x="16" y="26" font-size="16" font-weight="700">LDS / Mormon Funeral Cost</text>
<text x="16" y="48" font-size="16" font-weight="700">Estimates (2026)</text>
<text x="16" y="76">Funeral home services</text><rect x="125" y="84" width="109" height="16" rx="3" fill="#8a6d3b"/><text x="240" y="97" font-weight="600">$4,000–$8,000</text>
<text x="16" y="126">Temple clothing</text><rect x="17" y="134" width="4" height="16" rx="3" fill="#8a6d3b"/><text x="27" y="147" font-weight="600">$50–$200</text>
<text x="16" y="176">Casket</text><rect x="43" y="184" width="109" height="16" rx="3" fill="#8a6d3b"/><text x="158" y="197" font-weight="600">$1,000–$5,000</text>
<text x="16" y="226">Cemetery plot</text><rect x="43" y="234" width="109" height="16" rx="3" fill="#8a6d3b"/><text x="158" y="247" font-weight="600">$1,000–$5,000</text>
<text x="16" y="276">Burial vault</text><rect x="38" y="284" width="87" height="16" rx="3" fill="#8a6d3b"/><text x="131" y="297" font-weight="600">$800–$4,000</text>
<text x="16" y="326">Headstone / marker</text><rect x="43" y="334" width="55" height="16" rx="3" fill="#8a6d3b"/><text x="104" y="347" font-weight="600">$1,000–$3,000</text>
<text x="16" y="376">Flowers and programs</text><rect x="21" y="384" width="17" height="16" rx="3" fill="#8a6d3b"/><text x="44" y="397" font-weight="600">$200–$800</text>
</g>
</svg>
