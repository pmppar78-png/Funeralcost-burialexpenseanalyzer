<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="t d">
<title id="t">Memphis Funeral Cost Averages (2026)</title>
<desc id="d">Horizontal bar chart of Memphis Funeral Cost Averages (2026). Traditional funeral $7,035; Funeral with cremation $5,670; Direct cremation $1,680; Cemetery plot $3,150; Embalming $704; Casket $2,111; Burial vault / liner $1,260.</desc>
<rect width="360" height="420" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#2b2b2b">
<text x="16" y="26" font-size="16" font-weight="700">Memphis Funeral Cost Averages</text>
<text x="16" y="48" font-size="16" font-weight="700">(2026)</text>
<text x="16" y="76">Traditional funeral</text><rect x="16" y="84" width="218" height="16" rx="3" fill="#8a6d3b"/><text x="240" y="97" font-weight="600">$7,035</text>
<text x="16" y="126">Funeral with cremation</text><rect x="16" y="134" width="176" height="16" rx="3" fill="#8a6d3b"/><text x="198" y="147" font-weight="600">$5,670</text>
