<svg xmlns="http://www.w3.org/2000/svg" width="360" height="398" viewBox="0 0 360 398" role="img" aria-labelledby="t d">
<title id="t">New York burial estimates, 2026</title>
<desc id="d">Horizontal bar chart of New York burial estimates, 2026. Funeral service $10,800; Cemetery plot $5,400; Casket $3,240; Burial vault / liner $2,160; Opening &amp; closing grave $2,700; Headstone / marker $1,500; Embalming $1,080.</desc>
<rect width="360" height="398" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#2b2b2b">
<text x="16" y="26" font-size="16" font-weight="700">New York burial estimates, 2026</text>
<text x="16" y="54">Funeral service</text><rect x="16" y="62" width="218" height="16" rx="3" fill="#8a6d3b"/><text x="240" y="75" font-weight="600">$10,800</text>
<text x="16" y="104">Cemetery plot</text><rect x="16" y="112" width="109" height="16" rx="3" fill="#8a6d3b"/><text x="131" y="125" font-weight="600">$5,400</text>
<text x="16" y="154">Casket</text><rect x="16" y="162" width="65" height="16" rx="3" fill="#8a6d3b"/><text x="87" y="175" font-weight="600">$3,240</text>
<text x="16" y="204">Burial vault / liner</text><rect x="16" y="212" width="44" height="16" rx="3" fill="#8a6d3b"/><text x="66" y="225" font-weight="600">$2,160</text>
<text x="16" y="254">Opening &amp; closing grave</text><rect x="16" y="262" width="55" height="16" rx="3" fill="#8a6d3b"/><text x="77" y="275" font-weight="600">$2,700</text>
<text x="16" y="304">Headstone / marker</text><rect x="16" y="312" width="30" height="16" rx="3" fill="#8a6d3b"/><text x="52" y="325" font-weight="600">$1,500</text>
<text x="16" y="354">Embalming</text><rect x="16" y="362" width="22" height="16" rx="3" fill="#8a6d3b"/><text x="44" y="375" font-weight="600">$1,080</text>
</g>
</svg>
