<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="t d">
<title id="t">New York burial estimates, 2026</title>
<desc id="d">Horizontal bar chart of New York burial estimates, 2026. Funeral service $10,800; Cemetery plot $5,400; Casket $3,240; Burial vault / liner $2,160; Opening &amp; closing grave $2,700; Headstone / marker $1,500; Embalming $1,080.</desc>
<rect width="360" height="420" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#2b2b2b">
<text x="16" y="26" font-size="16" font-weight="700">New York burial estimates, 2026</text>
<text x="16" y="54">Funeral service</text><text x="344" y="54" text-anchor="end" font-weight="600">$10,800</text><rect x="16" y="60" width="328" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="106">Cemetery plot</text><text x="344" y="106" text-anchor="end" font-weight="600">$5,400</text><rect x="16" y="112" width="164" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="158">Casket</text><text x="344" y="158" text-anchor="end" font-weight="600">$3,240</text><rect x="16" y="164" width="98" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="210">Burial vault / liner</text><text x="344" y="210" text-anchor="end" font-weight="600">$2,160</text><rect x="16" y="216" width="66" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="262">Opening &amp; closing grave</text><text x="344" y="262" text-anchor="end" font-weight="600">$2,700</text><rect x="16" y="268" width="82" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="314">Headstone / marker</text><text x="344" y="314" text-anchor="end" font-weight="600">$1,500</text><rect x="16" y="320" width="46" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="366">Embalming</text><text x="344" y="366" text-anchor="end" font-weight="600">$1,080</text><rect x="16" y="372" width="33" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="416" font-size="11" fill="#6b5a4a">$0</text><text x="344" y="416" font-size="11" fill="#6b5a4a" text-anchor="end">$10,800</text>
</g>
