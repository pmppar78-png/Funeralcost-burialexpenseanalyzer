<svg xmlns="http://www.w3.org/2000/svg" width="680" height="244" viewBox="0 0 680 244" role="img" aria-labelledby="t d">
<title id="t">South Dakota Funeral Cost Averages (2026)</title>
<desc id="d">Horizontal bar chart of South Dakota Funeral Cost Averages (2026). Traditional funeral with burial $6,400; Funeral with cremation $5,200; Direct cremation $1,500; Cemetery / burial plot $2,800; Embalming $640; Casket $1,920.</desc>
<rect width="680" height="244" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="13" fill="#2b2b2b">
<text x="16" y="28" font-size="16" font-weight="700">South Dakota Funeral Cost Averages (2026)</text>
<line x1="230" y1="48" x2="230" y2="232" stroke="#bbbbbb"/>
<text x="222" y="67" text-anchor="end">Traditional funeral with burial</text><rect x="230" y="53" width="304" height="20" rx="3" fill="#8a6d3b"/><text x="668" y="67" text-anchor="end">$6,400</text>
<text x="222" y="97" text-anchor="end">Funeral with cremation</text><rect x="230" y="83" width="247" height="20" rx="3" fill="#8a6d3b"/><text x="668" y="97" text-anchor="end">$5,200</text>
<text x="222" y="127" text-anchor="end">Direct cremation</text><rect x="230" y="113" width="71" height="20" rx="3" fill="#8a6d3b"/><text x="668" y="127" text-anchor="end">$1,500</text>
<text x="222" y="157" text-anchor="end">Cemetery / burial plot</text><rect x="230" y="143" width="133" height="20" rx="3" fill="#8a6d3b"/><text x="668" y="157" text-anchor="end">$2,800</text>
<text x="222" y="187" text-anchor="end">Embalming</text><rect x="230" y="173" width="30" height="20" rx="3" fill="#8a6d3b"/><text x="668" y="187" text-anchor="end">$640</text>
<text x="222" y="217" text-anchor="end">Casket</text><rect x="230" y="203" width="91" height="20" rx="3" fill="#8a6d3b"/><text x="668" y="217" text-anchor="end">$1,920</text>
</g>
</svg>
