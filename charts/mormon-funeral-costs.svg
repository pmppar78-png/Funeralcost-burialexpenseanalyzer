<svg xmlns="http://www.w3.org/2000/svg" width="680" height="274" viewBox="0 0 680 274" role="img" aria-labelledby="t d">
<title id="t">LDS / Mormon Funeral Cost Estimates (2026)</title>
<desc id="d">Range chart of LDS / Mormon Funeral Cost Estimates (2026). Funeral home services $4,000 to $8,000; Temple clothing $50 to $200; Casket $1,000 to $5,000; Cemetery plot $1,000 to $5,000; Burial vault $800 to $4,000; Headstone / marker $1,000 to $3,000; Flowers and programs $200 to $800.</desc>
<rect width="680" height="274" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="13" fill="#2b2b2b">
<text x="16" y="28" font-size="16" font-weight="700">LDS / Mormon Funeral Cost Estimates (2026)</text>
<line x1="230" y1="48" x2="230" y2="262" stroke="#bbbbbb"/>
<text x="222" y="67" text-anchor="end">Funeral home services</text><rect x="387" y="53" width="157" height="20" rx="3" fill="#8a6d3b"/><text x="550" y="67">$4,000–$8,000</text>
<text x="222" y="97" text-anchor="end">Temple clothing</text><rect x="232" y="83" width="6" height="20" rx="3" fill="#8a6d3b"/><text x="244" y="97">$50–$200</text>
<text x="222" y="127" text-anchor="end">Casket</text><rect x="269" y="113" width="157" height="20" rx="3" fill="#8a6d3b"/><text x="432" y="127">$1,000–$5,000</text>
<text x="222" y="157" text-anchor="end">Cemetery plot</text><rect x="269" y="143" width="157" height="20" rx="3" fill="#8a6d3b"/><text x="432" y="157">$1,000–$5,000</text>
<text x="222" y="187" text-anchor="end">Burial vault</text><rect x="261" y="173" width="126" height="20" rx="3" fill="#8a6d3b"/><text x="393" y="187">$800–$4,000</text>
<text x="222" y="217" text-anchor="end">Headstone / marker</text><rect x="269" y="203" width="79" height="20" rx="3" fill="#8a6d3b"/><text x="354" y="217">$1,000–$3,000</text>
<text x="222" y="247" text-anchor="end">Flowers and programs</text><rect x="238" y="233" width="23" height="20" rx="3" fill="#8a6d3b"/><text x="267" y="247">$200–$800</text>
</g>
</svg>
