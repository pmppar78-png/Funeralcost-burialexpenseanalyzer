<svg xmlns="http://www.w3.org/2000/svg" width="680" height="274" viewBox="0 0 680 274" role="img" aria-labelledby="t d">
<title id="t">LDS / Mormon Funeral Cost Estimates (2026)</title>
<desc id="d">Range chart of LDS / Mormon Funeral Cost Estimates (2026). Funeral home services $4,000 to $8,000; Temple clothing $50 to $200; Casket $1,000 to $5,000; Cemetery plot $1,000 to $5,000; Burial vault $800 to $4,000; Headstone / marker $1,000 to $3,000; Flowers and programs $200 to $800.</desc>
