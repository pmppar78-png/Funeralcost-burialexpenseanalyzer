<g font-family="Inter, Arial, sans-serif" font-size="13" fill="#2b2b2b">
<text x="16" y="28" font-size="16" font-weight="700">LDS / Mormon Funeral Cost Estimates (2026)</text>
<line x1="230" y1="48" x2="230" y2="262" stroke="#bbbbbb"/>
<text x="222" y="67" text-anchor="end">Funeral home services</text><rect x="230" y="57" width="304" height="12" rx="3" fill="#efe7db"/><rect x="382" y="53" width="152" height="20" rx="3" fill="#8a6d3b"/><text x="668" y="67" text-anchor="end">$4,000–$8,000</text>
<text x="222" y="97" text-anchor="end">Temple clothing</text><rect x="230" y="87" width="304" height="12" rx="3" fill="#efe7db"/><rect x="230" y="83" width="16" height="20" rx="3" fill="#8a6d3b"/><text x="668" y="97" text-anchor="end">$50–$200</text>
<text x="222" y="127" text-anchor="end">Casket</text><rect x="230" y="117" width="304" height="12" rx="3" fill="#efe7db"/><rect x="268" y="113" width="152" height="20" rx="3" fill="#8a6d3b"/><text x="668" y="127" text-anchor="end">$1,000–$5,000</text>
<text x="222" y="157" text-anchor="end">Cemetery plot</text><rect x="230" y="147" width="304" height="12" rx="3" fill="#efe7db"/><rect x="268" y="143" width="152" height="20" rx="3" fill="#8a6d3b"/><text x="668" y="157" text-anchor="end">$1,000–$5,000</text>
<text x="222" y="187" text-anchor="end">Burial vault</text><rect x="230" y="177" width="304" height="12" rx="3" fill="#efe7db"/><rect x="260" y="173" width="122" height="20" rx="3" fill="#8a6d3b"/><text x="668" y="187" text-anchor="end">$800–$4,000</text>
