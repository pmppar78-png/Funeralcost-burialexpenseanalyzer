<title id="t">Indianapolis Funeral Cost Averages (2026)</title>
<desc id="d">Horizontal bar chart of Indianapolis Funeral Cost Averages (2026). Traditional funeral $7,590; Funeral with cremation $6,160; Direct cremation $1,760; Cemetery plot $3,520; Embalming $759; Casket $2,277; Burial vault / liner $1,408.</desc>
<rect width="360" height="420" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#2b2b2b">
<text x="16" y="26" font-size="16" font-weight="700">Indianapolis Funeral Cost Averages</text>
<text x="16" y="48" font-size="16" font-weight="700">(2026)</text>
<text x="16" y="76">Traditional funeral</text><rect x="16" y="84" width="218" height="16" rx="3" fill="#8a6d3b"/><text x="240" y="97" font-weight="600">$7,590</text>
<text x="16" y="126">Funeral with cremation</text><rect x="16" y="134" width="177" height="16" rx="3" fill="#8a6d3b"/><text x="199" y="147" font-weight="600">$6,160</text>
