<svg xmlns="http://www.w3.org/2000/svg" width="680" height="274" viewBox="0 0 680 274" role="img" aria-labelledby="t d">
<title id="t">Alabama burial estimates, 2026</title>
<desc id="d">Horizontal bar chart of Alabama burial estimates, 2026. Funeral service $6,400; Cemetery plot $3,200; Casket $1,920; Burial vault / liner $1,280; Opening &amp; closing grave $1,600; Headstone / marker $1,500; Embalming $640.</desc>
<rect width="680" height="274" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="13" fill="#2b2b2b">
<text x="16" y="28" font-size="16" font-weight="700">Alabama burial estimates, 2026</text>
<line x1="230" y1="48" x2="230" y2="262" stroke="#bbbbbb"/>
<text x="222" y="67" text-anchor="end">Funeral service</text><rect x="230" y="53" width="304" height="20" rx="3" fill="#8a6d3b"/><text x="668" y="67" text-anchor="end">$6,400</text>
<text x="222" y="97" text-anchor="end">Cemetery plot</text><rect x="230" y="83" width="152" height="20" rx="3" fill="#8a6d3b"/><text x="668" y="97" text-anchor="end">$3,200</text>
<text x="222" y="127" text-anchor="end">Casket</text><rect x="230" y="113" width="91" height="20" rx="3" fill="#8a6d3b"/><text x="668" y="127" text-anchor="end">$1,920</text>
<text x="222" y="157" text-anchor="end">Burial vault / liner</text><rect x="230" y="143" width="61" height="20" rx="3" fill="#8a6d3b"/><text x="668" y="157" text-anchor="end">$1,280</text>
<text x="222" y="187" text-anchor="end">Opening &amp; closing grave</text><rect x="230" y="173" width="76" height="20" rx="3" fill="#8a6d3b"/><text x="668" y="187" text-anchor="end">$1,600</text>
<text x="222" y="217" text-anchor="end">Headstone / marker</text><rect x="230" y="203" width="71" height="20" rx="3" fill="#8a6d3b"/><text x="668" y="217" text-anchor="end">$1,500</text>
<text x="222" y="247" text-anchor="end">Embalming</text><rect x="230" y="233" width="30" height="20" rx="3" fill="#8a6d3b"/><text x="668" y="247" text-anchor="end">$640</text>
</g>
</svg>
