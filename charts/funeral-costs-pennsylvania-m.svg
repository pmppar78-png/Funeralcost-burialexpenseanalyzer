<text x="16" y="204">Cemetery / burial plot</text><rect x="16" y="212" width="108" height="16" rx="3" fill="#8a6d3b"/><text x="130" y="225" font-weight="600">$4,200</text>
<text x="16" y="254">Embalming</text><rect x="16" y="262" width="22" height="16" rx="3" fill="#8a6d3b"/><text x="44" y="275" font-weight="600">$850</text>
<text x="16" y="304">Casket</text><rect x="16" y="312" width="65" height="16" rx="3" fill="#8a6d3b"/><text x="87" y="325" font-weight="600">$2,550</text>
