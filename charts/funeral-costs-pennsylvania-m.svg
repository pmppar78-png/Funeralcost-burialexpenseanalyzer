<svg xmlns="http://www.w3.org/2000/svg" width="360" height="348" viewBox="0 0 360 348" role="img" aria-labelledby="t d">
<title id="t">Pennsylvania estimates, 2026</title>
<desc id="d">Horizontal bar chart of Pennsylvania estimates, 2026. Traditional funeral with burial $8,500; Funeral with cremation $6,600; Direct cremation $2,000; Cemetery / burial plot $4,200; Embalming $850; Casket $2,550.</desc>
<rect width="360" height="348" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#2b2b2b">
<text x="16" y="26" font-size="16" font-weight="700">Pennsylvania estimates, 2026</text>
<text x="16" y="54">Traditional funeral with burial</text><rect x="16" y="62" width="218" height="16" rx="3" fill="#8a6d3b"/><text x="240" y="75" font-weight="600">$8,500</text>
<text x="16" y="104">Funeral with cremation</text><rect x="16" y="112" width="169" height="16" rx="3" fill="#8a6d3b"/><text x="191" y="125" font-weight="600">$6,600</text>
