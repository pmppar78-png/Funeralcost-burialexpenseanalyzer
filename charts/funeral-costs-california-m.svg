<rect width="360" height="348" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#2b2b2b">
<text x="16" y="26" font-size="16" font-weight="700">California estimates, 2026</text>
<text x="16" y="54">Traditional funeral with burial</text><rect x="16" y="62" width="218" height="16" rx="3" fill="#8a6d3b"/><text x="240" y="75" font-weight="600">$10,600</text>
<text x="16" y="104">Funeral with cremation</text><rect x="16" y="112" width="160" height="16" rx="3" fill="#8a6d3b"/><text x="182" y="125" font-weight="600">$7,800</text>
