<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="t d">
<title id="t">Burial Costs in Maryland (2026)</title>
<desc id="d">Horizontal bar chart of Burial Costs in Maryland (2026). Funeral service $9,200; Cemetery plot $4,600; Casket $2,760; Burial vault / liner $1,840; Opening &amp; closing grave $2,300; Headstone / marker $1,500; Embalming $920.</desc>
<rect width="360" height="420" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#2b2b2b">
<text x="16" y="26" font-size="16" font-weight="700">Burial Costs in Maryland (2026)</text>
<text x="16" y="54">Funeral service</text><text x="344" y="54" text-anchor="end" font-weight="600">$9,200</text><rect x="16" y="60" width="328" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="106">Cemetery plot</text><text x="344" y="106" text-anchor="end" font-weight="600">$4,600</text><rect x="16" y="112" width="164" height="16" rx="3" fill="#8a6d3b"/>
