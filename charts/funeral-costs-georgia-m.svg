<svg xmlns="http://www.w3.org/2000/svg" width="360" height="370" viewBox="0 0 360 370" role="img" aria-labelledby="t d">
<title id="t">Estimated Georgia funeral prices for 2026</title>
<desc id="d">Horizontal bar chart of Estimated Georgia funeral prices for 2026. Traditional funeral with burial $6,900; Funeral with cremation $5,600; Direct cremation $1,700; Cemetery / burial plot $3,200; Embalming $690; Casket $2,070.</desc>
<rect width="360" height="370" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#2b2b2b">
<text x="16" y="26" font-size="16" font-weight="700">Estimated Georgia funeral prices</text>
<text x="16" y="48" font-size="16" font-weight="700">for 2026</text>
<text x="16" y="76">Traditional funeral with burial</text><rect x="16" y="84" width="218" height="16" rx="3" fill="#8a6d3b"/><text x="240" y="97" font-weight="600">$6,900</text>
<text x="16" y="126">Funeral with cremation</text><rect x="16" y="134" width="177" height="16" rx="3" fill="#8a6d3b"/><text x="199" y="147" font-weight="600">$5,600</text>
<text x="16" y="176">Direct cremation</text><rect x="16" y="184" width="54" height="16" rx="3" fill="#8a6d3b"/><text x="76" y="197" font-weight="600">$1,700</text>
<text x="16" y="226">Cemetery / burial plot</text><rect x="16" y="234" width="101" height="16" rx="3" fill="#8a6d3b"/><text x="123" y="247" font-weight="600">$3,200</text>
<text x="16" y="276">Embalming</text><rect x="16" y="284" width="22" height="16" rx="3" fill="#8a6d3b"/><text x="44" y="297" font-weight="600">$690</text>
<text x="16" y="326">Casket</text><rect x="16" y="334" width="65" height="16" rx="3" fill="#8a6d3b"/><text x="87" y="347" font-weight="600">$2,070</text>
</g>
</svg>
