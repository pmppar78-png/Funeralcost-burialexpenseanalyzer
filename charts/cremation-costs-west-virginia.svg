<svg xmlns="http://www.w3.org/2000/svg" width="680" height="244" viewBox="0 0 680 244" role="img" aria-labelledby="t d">
<title id="t">West Virginia cremation prices, 2026 estimates</title>
<desc id="d">Range chart of West Virginia cremation prices, 2026 estimates. Direct cremation $980 to $1,960; Cremation with service $4,000 to $6,500; Basic urn $25 to $3,000 or more; Memorial service $0 to $5,000; Cremation jewelry $20 to $2,000 or more; Scattering service $0 to $1,500.</desc>
<rect width="680" height="244" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="13" fill="#2b2b2b">
<text x="16" y="28" font-size="16" font-weight="700">West Virginia cremation prices, 2026 estimates</text>
<line x1="230" y1="48" x2="230" y2="232" stroke="#bbbbbb"/>
<text x="222" y="67" text-anchor="end">Direct cremation</text><rect x="277" y="53" width="48" height="20" rx="3" fill="#8a6d3b"/><text x="331" y="67">$980–$1,960</text>
<text x="222" y="97" text-anchor="end">Cremation with service</text><rect x="423" y="83" width="121" height="20" rx="3" fill="#8a6d3b"/><text x="550" y="97">$4,000–$6,500</text>
<text x="222" y="127" text-anchor="end">Basic urn</text><rect x="231" y="113" width="144" height="20" rx="3" fill="#8a6d3b"/><text x="381" y="127">$25–$3,000+</text>
<text x="222" y="157" text-anchor="end">Memorial service</text><rect x="230" y="143" width="242" height="20" rx="3" fill="#8a6d3b"/><text x="478" y="157">$0–$5,000</text>
<text x="222" y="187" text-anchor="end">Cremation jewelry</text><rect x="231" y="173" width="96" height="20" rx="3" fill="#8a6d3b"/><text x="333" y="187">$20–$2,000+</text>
<text x="222" y="217" text-anchor="end">Scattering service</text><rect x="230" y="203" width="72" height="20" rx="3" fill="#8a6d3b"/><text x="308" y="217">$0–$1,500</text>
</g>
</svg>
