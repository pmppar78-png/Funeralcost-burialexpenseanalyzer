<svg xmlns="http://www.w3.org/2000/svg" width="360" height="370" viewBox="0 0 360 370" role="img" aria-labelledby="t d">
<title id="t">What we estimate Louisiana families pay, 2026</title>
<desc id="d">Horizontal bar chart of What we estimate Louisiana families pay, 2026. Traditional funeral with burial $6,700; Funeral with cremation $5,400; Direct cremation $1,700; Cemetery / burial plot $3,200; Embalming $670; Casket $2,010.</desc>
<rect width="360" height="370" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#2b2b2b">
<text x="16" y="26" font-size="16" font-weight="700">What we estimate Louisiana</text>
<text x="16" y="48" font-size="16" font-weight="700">families pay, 2026</text>
<text x="16" y="76">Traditional funeral with burial</text><rect x="16" y="84" width="218" height="16" rx="3" fill="#8a6d3b"/><text x="240" y="97" font-weight="600">$6,700</text>
<text x="16" y="126">Funeral with cremation</text><rect x="16" y="134" width="176" height="16" rx="3" fill="#8a6d3b"/><text x="198" y="147" font-weight="600">$5,400</text>
<text x="16" y="176">Direct cremation</text><rect x="16" y="184" width="55" height="16" rx="3" fill="#8a6d3b"/><text x="77" y="197" font-weight="600">$1,700</text>
<text x="16" y="226">Cemetery / burial plot</text><rect x="16" y="234" width="104" height="16" rx="3" fill="#8a6d3b"/><text x="126" y="247" font-weight="600">$3,200</text>
<text x="16" y="276">Embalming</text><rect x="16" y="284" width="22" height="16" rx="3" fill="#8a6d3b"/><text x="44" y="297" font-weight="600">$670</text>
<text x="16" y="326">Casket</text><rect x="16" y="334" width="65" height="16" rx="3" fill="#8a6d3b"/><text x="87" y="347" font-weight="600">$2,010</text>
</g>
</svg>
