<svg xmlns="http://www.w3.org/2000/svg" width="360" height="370" viewBox="0 0 360 370" role="img" aria-labelledby="t d">
<title id="t">What an Arkansas funeral costs (2026 estimates)</title>
<desc id="d">Horizontal bar chart of What an Arkansas funeral costs (2026 estimates). Traditional funeral with burial $6,100; Funeral with cremation $5,000; Direct cremation $1,500; Cemetery / burial plot $2,800; Embalming $610; Casket $1,830.</desc>
<rect width="360" height="370" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#2b2b2b">
<text x="16" y="26" font-size="16" font-weight="700">What an Arkansas funeral costs</text>
<text x="16" y="48" font-size="16" font-weight="700">(2026 estimates)</text>
<text x="16" y="76">Traditional funeral with burial</text><rect x="16" y="84" width="218" height="16" rx="3" fill="#8a6d3b"/><text x="240" y="97" font-weight="600">$6,100</text>
<text x="16" y="126">Funeral with cremation</text><rect x="16" y="134" width="179" height="16" rx="3" fill="#8a6d3b"/><text x="201" y="147" font-weight="600">$5,000</text>
<text x="16" y="176">Direct cremation</text><rect x="16" y="184" width="54" height="16" rx="3" fill="#8a6d3b"/><text x="76" y="197" font-weight="600">$1,500</text>
<text x="16" y="226">Cemetery / burial plot</text><rect x="16" y="234" width="100" height="16" rx="3" fill="#8a6d3b"/><text x="122" y="247" font-weight="600">$2,800</text>
<text x="16" y="276">Embalming</text><rect x="16" y="284" width="22" height="16" rx="3" fill="#8a6d3b"/><text x="44" y="297" font-weight="600">$610</text>
<text x="16" y="326">Casket</text><rect x="16" y="334" width="65" height="16" rx="3" fill="#8a6d3b"/><text x="87" y="347" font-weight="600">$1,830</text>
</g>
</svg>
