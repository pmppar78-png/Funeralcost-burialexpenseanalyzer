<svg xmlns="http://www.w3.org/2000/svg" width="360" height="348" viewBox="0 0 360 348" role="img" aria-labelledby="t d">
<title id="t">Washington DC Burial Costs (2026)</title>
<desc id="d">Horizontal bar chart of Washington DC Burial Costs (2026). Funeral service (with casket) $8,200; Cemetery plot $4,000; Casket $2,460; Burial vault / liner $1,600; Opening &amp; closing grave $2,000; Embalming $820.</desc>
<rect width="360" height="348" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#2b2b2b">
<text x="16" y="26" font-size="16" font-weight="700">Washington DC Burial Costs (2026)</text>
<text x="16" y="54">Funeral service (with casket)</text><rect x="16" y="62" width="218" height="16" rx="3" fill="#8a6d3b"/><text x="240" y="75" font-weight="600">$8,200</text>
<text x="16" y="104">Cemetery plot</text><rect x="16" y="112" width="106" height="16" rx="3" fill="#8a6d3b"/><text x="128" y="125" font-weight="600">$4,000</text>
<text x="16" y="154">Casket</text><rect x="16" y="162" width="65" height="16" rx="3" fill="#8a6d3b"/><text x="87" y="175" font-weight="600">$2,460</text>
<text x="16" y="204">Burial vault / liner</text><rect x="16" y="212" width="43" height="16" rx="3" fill="#8a6d3b"/><text x="65" y="225" font-weight="600">$1,600</text>
<text x="16" y="254">Opening &amp; closing grave</text><rect x="16" y="262" width="53" height="16" rx="3" fill="#8a6d3b"/><text x="75" y="275" font-weight="600">$2,000</text>
<text x="16" y="304">Embalming</text><rect x="16" y="312" width="22" height="16" rx="3" fill="#8a6d3b"/><text x="44" y="325" font-weight="600">$820</text>
</g>
</svg>
