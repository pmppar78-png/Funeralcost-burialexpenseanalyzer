<svg xmlns="http://www.w3.org/2000/svg" width="360" height="348" viewBox="0 0 360 348" role="img" aria-labelledby="t d">
<title id="t">Maryland funeral estimates, 2026</title>
<desc id="d">Horizontal bar chart of Maryland funeral estimates, 2026. Traditional funeral with burial $9,200; Funeral with cremation $7,000; Direct cremation $2,200; Cemetery / burial plot $4,600; Embalming $920; Casket $2,760.</desc>
<rect width="360" height="348" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#2b2b2b">
<text x="16" y="26" font-size="16" font-weight="700">Maryland funeral estimates, 2026</text>
<text x="16" y="54">Traditional funeral with burial</text><rect x="16" y="62" width="218" height="16" rx="3" fill="#8a6d3b"/><text x="240" y="75" font-weight="600">$9,200</text>
<text x="16" y="104">Funeral with cremation</text><rect x="16" y="112" width="166" height="16" rx="3" fill="#8a6d3b"/><text x="188" y="125" font-weight="600">$7,000</text>
<text x="16" y="154">Direct cremation</text><rect x="16" y="162" width="52" height="16" rx="3" fill="#8a6d3b"/><text x="74" y="175" font-weight="600">$2,200</text>
<text x="16" y="204">Cemetery / burial plot</text><rect x="16" y="212" width="109" height="16" rx="3" fill="#8a6d3b"/><text x="131" y="225" font-weight="600">$4,600</text>
<text x="16" y="254">Embalming</text><rect x="16" y="262" width="22" height="16" rx="3" fill="#8a6d3b"/><text x="44" y="275" font-weight="600">$920</text>
<text x="16" y="304">Casket</text><rect x="16" y="312" width="65" height="16" rx="3" fill="#8a6d3b"/><text x="87" y="325" font-weight="600">$2,760</text>
</g>
</svg>
