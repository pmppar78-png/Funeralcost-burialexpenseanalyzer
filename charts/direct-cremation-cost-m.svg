<svg xmlns="http://www.w3.org/2000/svg" width="360" height="472" viewBox="0 0 360 472" role="img" aria-labelledby="t d">
<title id="t">Direct Cremation Cost</title>
<desc id="d">Range chart of Direct Cremation Cost. Basic services fee $2,000 to $3,000; Embalming $500 to $800; Viewing / visitation $400 to $800; Funeral ceremony $400 to $700; Casket or rental casket $1,000 to $4,000 or more; Cremation fee $250 to $500; Transport $300 to $600; Typical Total $5,000 to $9,000 or more.</desc>
<rect width="360" height="472" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#2b2b2b">
<text x="16" y="26" font-size="16" font-weight="700">Direct Cremation Cost</text>
<text x="16" y="54">Basic services fee</text><text x="344" y="54" text-anchor="end" font-weight="600">$2,000–$3,000</text><rect x="16" y="64" width="328" height="12" rx="3" fill="#efe7db"/><rect x="89" y="60" width="36" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="106">Embalming</text><text x="344" y="106" text-anchor="end" font-weight="600">$500–$800</text><rect x="16" y="116" width="328" height="12" rx="3" fill="#efe7db"/><rect x="32" y="112" width="16" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="158">Viewing / visitation</text><text x="344" y="158" text-anchor="end" font-weight="600">$400–$800</text><rect x="16" y="168" width="328" height="12" rx="3" fill="#efe7db"/><rect x="30" y="164" width="16" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="210">Funeral ceremony</text><text x="344" y="210" text-anchor="end" font-weight="600">$400–$700</text><rect x="16" y="220" width="328" height="12" rx="3" fill="#efe7db"/><rect x="29" y="216" width="16" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="262">Casket or rental casket</text><text x="344" y="262" text-anchor="end" font-weight="600">$1,000–$4,000+</text><rect x="16" y="272" width="328" height="12" rx="3" fill="#efe7db"/><rect x="52" y="268" width="110" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="314">Cremation fee</text><text x="344" y="314" text-anchor="end" font-weight="600">$250–$500</text><rect x="16" y="324" width="328" height="12" rx="3" fill="#efe7db"/><rect x="22" y="320" width="16" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="366">Transport</text><text x="344" y="366" text-anchor="end" font-weight="600">$300–$600</text><rect x="16" y="376" width="328" height="12" rx="3" fill="#efe7db"/><rect x="25" y="372" width="16" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="418">Typical Total</text><text x="344" y="418" text-anchor="end" font-weight="600">$5,000–$9,000+</text><rect x="16" y="428" width="328" height="12" rx="3" fill="#efe7db"/><rect x="198" y="424" width="146" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="468" font-size="11" fill="#6b5a4a">$0</text><text x="344" y="468" font-size="11" fill="#6b5a4a" text-anchor="end">$9,000</text>
</g>
