<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="t d">
<title id="t">Burial Costs in Nevada (2026)</title>
<desc id="d">Horizontal bar chart of Burial Costs in Nevada (2026). Funeral service $8,000; Cemetery plot $3,800; Casket $2,400; Burial vault / liner $1,520; Opening &amp; closing grave $1,900; Headstone / marker $1,500; Embalming $800.</desc>
<rect width="360" height="420" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#2b2b2b">
<text x="16" y="26" font-size="16" font-weight="700">Burial Costs in Nevada (2026)</text>
<text x="16" y="54">Funeral service</text><text x="344" y="54" text-anchor="end" font-weight="600">$8,000</text><rect x="16" y="60" width="328" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="106">Cemetery plot</text><text x="344" y="106" text-anchor="end" font-weight="600">$3,800</text><rect x="16" y="112" width="156" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="158">Casket</text><text x="344" y="158" text-anchor="end" font-weight="600">$2,400</text><rect x="16" y="164" width="98" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="210">Burial vault / liner</text><text x="344" y="210" text-anchor="end" font-weight="600">$1,520</text><rect x="16" y="216" width="62" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="262">Opening &amp; closing grave</text><text x="344" y="262" text-anchor="end" font-weight="600">$1,900</text><rect x="16" y="268" width="78" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="314">Headstone / marker</text><text x="344" y="314" text-anchor="end" font-weight="600">$1,500</text><rect x="16" y="320" width="62" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="366">Embalming</text><text x="344" y="366" text-anchor="end" font-weight="600">$800</text><rect x="16" y="372" width="33" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="416" font-size="11" fill="#6b5a4a">$0</text><text x="344" y="416" font-size="11" fill="#6b5a4a" text-anchor="end">$8,000</text>
</g>
