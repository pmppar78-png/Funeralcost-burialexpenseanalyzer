<svg xmlns="http://www.w3.org/2000/svg" width="360" height="398" viewBox="0 0 360 398" role="img" aria-labelledby="t d">
<title id="t">Burial Costs in Nevada (2026)</title>
<desc id="d">Horizontal bar chart of Burial Costs in Nevada (2026). Funeral service $8,000; Cemetery plot $3,800; Casket $2,400; Burial vault / liner $1,520; Opening &amp; closing grave $1,900; Headstone / marker $1,500; Embalming $800.</desc>
<rect width="360" height="398" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#2b2b2b">
<text x="16" y="26" font-size="16" font-weight="700">Burial Costs in Nevada (2026)</text>
<text x="16" y="54">Funeral service</text><rect x="16" y="62" width="218" height="16" rx="3" fill="#8a6d3b"/><text x="240" y="75" font-weight="600">$8,000</text>
<text x="16" y="104">Cemetery plot</text><rect x="16" y="112" width="104" height="16" rx="3" fill="#8a6d3b"/><text x="126" y="125" font-weight="600">$3,800</text>
<text x="16" y="154">Casket</text><rect x="16" y="162" width="65" height="16" rx="3" fill="#8a6d3b"/><text x="87" y="175" font-weight="600">$2,400</text>
<text x="16" y="204">Burial vault / liner</text><rect x="16" y="212" width="41" height="16" rx="3" fill="#8a6d3b"/><text x="63" y="225" font-weight="600">$1,520</text>
<text x="16" y="254">Opening &amp; closing grave</text><rect x="16" y="262" width="52" height="16" rx="3" fill="#8a6d3b"/><text x="74" y="275" font-weight="600">$1,900</text>
<text x="16" y="304">Headstone / marker</text><rect x="16" y="312" width="41" height="16" rx="3" fill="#8a6d3b"/><text x="63" y="325" font-weight="600">$1,500</text>
<text x="16" y="354">Embalming</text><rect x="16" y="362" width="22" height="16" rx="3" fill="#8a6d3b"/><text x="44" y="375" font-weight="600">$800</text>
</g>
</svg>
