<svg xmlns="http://www.w3.org/2000/svg" width="360" height="370" viewBox="0 0 360 370" role="img" aria-labelledby="t d">
<title id="t">New Hampshire Funeral Cost Averages (2026)</title>
<desc id="d">Horizontal bar chart of New Hampshire Funeral Cost Averages (2026). Traditional funeral with burial $8,800; Funeral with cremation $6,800; Direct cremation $2,100; Cemetery / burial plot $4,400; Embalming $880; Casket $2,640.</desc>
<rect width="360" height="370" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#2b2b2b">
<text x="16" y="26" font-size="16" font-weight="700">New Hampshire Funeral Cost</text>
<text x="16" y="48" font-size="16" font-weight="700">Averages (2026)</text>
<text x="16" y="76">Traditional funeral with burial</text><rect x="16" y="84" width="218" height="16" rx="3" fill="#8a6d3b"/><text x="240" y="97" font-weight="600">$8,800</text>
<text x="16" y="126">Funeral with cremation</text><rect x="16" y="134" width="168" height="16" rx="3" fill="#8a6d3b"/><text x="190" y="147" font-weight="600">$6,800</text>
<text x="16" y="176">Direct cremation</text><rect x="16" y="184" width="52" height="16" rx="3" fill="#8a6d3b"/><text x="74" y="197" font-weight="600">$2,100</text>
<text x="16" y="226">Cemetery / burial plot</text><rect x="16" y="234" width="109" height="16" rx="3" fill="#8a6d3b"/><text x="131" y="247" font-weight="600">$4,400</text>
<text x="16" y="276">Embalming</text><rect x="16" y="284" width="22" height="16" rx="3" fill="#8a6d3b"/><text x="44" y="297" font-weight="600">$880</text>
<text x="16" y="326">Casket</text><rect x="16" y="334" width="65" height="16" rx="3" fill="#8a6d3b"/><text x="87" y="347" font-weight="600">$2,640</text>
</g>
</svg>
