<svg xmlns="http://www.w3.org/2000/svg" width="360" height="470" viewBox="0 0 360 470" role="img" aria-labelledby="t d">
<title id="t">Funeral Costs by Religion (2026): What Each Tradition Costs</title>
<desc id="d">Range chart of Funeral Costs by Religion (2026): What Each Tradition Costs. Catholic $7,000 to $15,000; Protestant $5,000 to $14,000; Jewish $5,000 to $12,000; Muslim $3,000 to $8,000; Hindu $3,000 to $10,000; Buddhist $3,000 to $12,000; LDS (Mormon) $6,000 to $14,000; Sikh $3,000 to $7,000.</desc>
<rect width="360" height="470" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#2b2b2b">
<text x="16" y="26" font-size="16" font-weight="700">Funeral Costs by Religion (2026):</text>
<text x="16" y="48" font-size="16" font-weight="700">What Each Tradition Costs</text>
<text x="16" y="76">Catholic</text><rect x="118" y="84" width="116" height="16" rx="3" fill="#8a6d3b"/><text x="240" y="97" font-weight="600">$7,000–$15,000</text>
<text x="16" y="126">Protestant</text><rect x="89" y="134" width="130" height="16" rx="3" fill="#8a6d3b"/><text x="225" y="147" font-weight="600">$5,000–$14,000</text>
<text x="16" y="176">Jewish</text><rect x="89" y="184" width="101" height="16" rx="3" fill="#8a6d3b"/><text x="196" y="197" font-weight="600">$5,000–$12,000</text>
<text x="16" y="226">Muslim</text><rect x="60" y="234" width="72" height="16" rx="3" fill="#8a6d3b"/><text x="138" y="247" font-weight="600">$3,000–$8,000</text>
<text x="16" y="276">Hindu</text><rect x="60" y="284" width="101" height="16" rx="3" fill="#8a6d3b"/><text x="167" y="297" font-weight="600">$3,000–$10,000</text>
<text x="16" y="326">Buddhist</text><rect x="60" y="334" width="130" height="16" rx="3" fill="#8a6d3b"/><text x="196" y="347" font-weight="600">$3,000–$12,000</text>
<text x="16" y="376">LDS (Mormon)</text><rect x="103" y="384" width="116" height="16" rx="3" fill="#8a6d3b"/><text x="225" y="397" font-weight="600">$6,000–$14,000</text>
<text x="16" y="426">Sikh</text><rect x="60" y="434" width="58" height="16" rx="3" fill="#8a6d3b"/><text x="124" y="447" font-weight="600">$3,000–$7,000</text>
</g>
</svg>
