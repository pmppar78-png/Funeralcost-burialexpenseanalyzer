<svg xmlns="http://www.w3.org/2000/svg" width="680" height="274" viewBox="0 0 680 274" role="img" aria-labelledby="t d">
<title id="t">Alaska burial estimates for 2026</title>
<desc id="d">Horizontal bar chart of Alaska burial estimates for 2026. Funeral service $9,800; Cemetery plot $4,500; Casket $2,940; Burial vault / liner $1,800; Opening &amp; closing grave $2,250; Headstone / marker $1,500; Embalming $980.</desc>
<rect width="680" height="274" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="13" fill="#2b2b2b">
<text x="16" y="28" font-size="16" font-weight="700">Alaska burial estimates for 2026</text>
<line x1="230" y1="48" x2="230" y2="262" stroke="#bbbbbb"/>
<text x="222" y="67" text-anchor="end">Funeral service</text><rect x="230" y="53" width="304" height="20" rx="3" fill="#8a6d3b"/><text x="668" y="67" text-anchor="end">$9,800</text>
<text x="222" y="97" text-anchor="end">Cemetery plot</text><rect x="230" y="83" width="140" height="20" rx="3" fill="#8a6d3b"/><text x="668" y="97" text-anchor="end">$4,500</text>
<text x="222" y="127" text-anchor="end">Casket</text><rect x="230" y="113" width="91" height="20" rx="3" fill="#8a6d3b"/><text x="668" y="127" text-anchor="end">$2,940</text>
<text x="222" y="157" text-anchor="end">Burial vault / liner</text><rect x="230" y="143" width="56" height="20" rx="3" fill="#8a6d3b"/><text x="668" y="157" text-anchor="end">$1,800</text>
<text x="222" y="187" text-anchor="end">Opening &amp; closing grave</text><rect x="230" y="173" width="70" height="20" rx="3" fill="#8a6d3b"/><text x="668" y="187" text-anchor="end">$2,250</text>
<text x="222" y="217" text-anchor="end">Headstone / marker</text><rect x="230" y="203" width="47" height="20" rx="3" fill="#8a6d3b"/><text x="668" y="217" text-anchor="end">$1,500</text>
<text x="222" y="247" text-anchor="end">Embalming</text><rect x="230" y="233" width="30" height="20" rx="3" fill="#8a6d3b"/><text x="668" y="247" text-anchor="end">$980</text>
</g>
</svg>
