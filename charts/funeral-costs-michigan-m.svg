<svg xmlns="http://www.w3.org/2000/svg" width="360" height="370" viewBox="0 0 360 370" role="img" aria-labelledby="t d">
<title id="t">Estimated Michigan funeral costs (2026)</title>
<desc id="d">Horizontal bar chart of Estimated Michigan funeral costs (2026). Traditional funeral with burial $7,200; Funeral with cremation $5,800; Direct cremation $1,700; Cemetery / burial plot $3,400; Embalming $720; Casket $2,160.</desc>
<rect width="360" height="370" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#2b2b2b">
<text x="16" y="26" font-size="16" font-weight="700">Estimated Michigan funeral costs</text>
<text x="16" y="48" font-size="16" font-weight="700">(2026)</text>
<text x="16" y="76">Traditional funeral with burial</text><rect x="16" y="84" width="218" height="16" rx="3" fill="#8a6d3b"/><text x="240" y="97" font-weight="600">$7,200</text>
<text x="16" y="126">Funeral with cremation</text><rect x="16" y="134" width="176" height="16" rx="3" fill="#8a6d3b"/><text x="198" y="147" font-weight="600">$5,800</text>
<text x="16" y="176">Direct cremation</text><rect x="16" y="184" width="51" height="16" rx="3" fill="#8a6d3b"/><text x="73" y="197" font-weight="600">$1,700</text>
<text x="16" y="226">Cemetery / burial plot</text><rect x="16" y="234" width="103" height="16" rx="3" fill="#8a6d3b"/><text x="125" y="247" font-weight="600">$3,400</text>
<text x="16" y="276">Embalming</text><rect x="16" y="284" width="22" height="16" rx="3" fill="#8a6d3b"/><text x="44" y="297" font-weight="600">$720</text>
<text x="16" y="326">Casket</text><rect x="16" y="334" width="65" height="16" rx="3" fill="#8a6d3b"/><text x="87" y="347" font-weight="600">$2,160</text>
</g>
</svg>
