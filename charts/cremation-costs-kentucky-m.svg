<title id="t">2026 Kentucky cremation charges as we estimate them</title>
<desc id="d">Range chart of 2026 Kentucky cremation charges as we estimate them. Direct cremation $1,120 to $2,240; Cremation with service $4,160 to $6,760; Basic urn $25 to $3,000 or more; Memorial service $0 to $5,000; Cremation jewelry $20 to $2,000 or more; Scattering service $0 to $1,500.</desc>
