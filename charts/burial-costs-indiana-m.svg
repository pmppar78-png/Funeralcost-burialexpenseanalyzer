<svg xmlns="http://www.w3.org/2000/svg" width="360" height="442" viewBox="0 0 360 442" role="img" aria-labelledby="t d">
<title id="t">What an Indiana burial costs (2026 estimates)</title>
<desc id="d">Horizontal bar chart of What an Indiana burial costs (2026 estimates). Funeral service $6,900; Cemetery plot $3,200; Casket $2,070; Burial vault / liner $1,280; Opening &amp; closing grave $1,600; Headstone / marker $1,500; Embalming $690.</desc>
<rect width="360" height="442" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#2b2b2b">
<text x="16" y="26" font-size="16" font-weight="700">What an Indiana burial costs (2026</text>
<text x="16" y="48" font-size="16" font-weight="700">estimates)</text>
<text x="16" y="76">Funeral service</text><text x="344" y="76" text-anchor="end" font-weight="600">$6,900</text><rect x="16" y="82" width="328" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="128">Cemetery plot</text><text x="344" y="128" text-anchor="end" font-weight="600">$3,200</text><rect x="16" y="134" width="152" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="180">Casket</text><text x="344" y="180" text-anchor="end" font-weight="600">$2,070</text><rect x="16" y="186" width="98" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="232">Burial vault / liner</text><text x="344" y="232" text-anchor="end" font-weight="600">$1,280</text><rect x="16" y="238" width="61" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="284">Opening &amp; closing grave</text><text x="344" y="284" text-anchor="end" font-weight="600">$1,600</text><rect x="16" y="290" width="76" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="336">Headstone / marker</text><text x="344" y="336" text-anchor="end" font-weight="600">$1,500</text><rect x="16" y="342" width="71" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="388">Embalming</text><text x="344" y="388" text-anchor="end" font-weight="600">$690</text><rect x="16" y="394" width="33" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="438" font-size="11" fill="#6b5a4a">$0</text><text x="344" y="438" font-size="11" fill="#6b5a4a" text-anchor="end">$6,900</text>
</g>
</svg>
