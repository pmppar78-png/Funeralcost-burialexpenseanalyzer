<svg xmlns="http://www.w3.org/2000/svg" width="360" height="370" viewBox="0 0 360 370" role="img" aria-labelledby="t d">
<title id="t">Massachusetts: what each funeral item costs (2026 estimate)</title>
<desc id="d">Horizontal bar chart of Massachusetts: what each funeral item costs (2026 estimate). Traditional funeral with burial $10,400; Funeral with cremation $7,800; Direct cremation $2,500; Cemetery / burial plot $5,200; Embalming $1,040; Casket $3,120.</desc>
<rect width="360" height="370" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#2b2b2b">
<text x="16" y="26" font-size="16" font-weight="700">Massachusetts: what each funeral</text>
<text x="16" y="48" font-size="16" font-weight="700">item costs (2026 estimate)</text>
<text x="16" y="76">Traditional funeral with burial</text><rect x="16" y="84" width="218" height="16" rx="3" fill="#8a6d3b"/><text x="240" y="97" font-weight="600">$10,400</text>
<text x="16" y="126">Funeral with cremation</text><rect x="16" y="134" width="164" height="16" rx="3" fill="#8a6d3b"/><text x="186" y="147" font-weight="600">$7,800</text>
<text x="16" y="176">Direct cremation</text><rect x="16" y="184" width="52" height="16" rx="3" fill="#8a6d3b"/><text x="74" y="197" font-weight="600">$2,500</text>
<text x="16" y="226">Cemetery / burial plot</text><rect x="16" y="234" width="109" height="16" rx="3" fill="#8a6d3b"/><text x="131" y="247" font-weight="600">$5,200</text>
<text x="16" y="276">Embalming</text><rect x="16" y="284" width="22" height="16" rx="3" fill="#8a6d3b"/><text x="44" y="297" font-weight="600">$1,040</text>
<text x="16" y="326">Casket</text><rect x="16" y="334" width="65" height="16" rx="3" fill="#8a6d3b"/><text x="87" y="347" font-weight="600">$3,120</text>
</g>
</svg>
