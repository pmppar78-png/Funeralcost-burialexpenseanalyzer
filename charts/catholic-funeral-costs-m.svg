<svg xmlns="http://www.w3.org/2000/svg" width="360" height="470" viewBox="0 0 360 470" role="img" aria-labelledby="t d">
<title id="t">Catholic Funeral Cost Estimates (2026)</title>
<desc id="d">Range chart of Catholic Funeral Cost Estimates (2026). Vigil / Wake service $500 to $2,000; Funeral Mass (church offering) $200 to $500; Funeral home services $5,000 to $10,000; Casket $1,000 to $5,000; Cemetery plot (Catholic cemetery) $1,500 to $6,000; Burial vault $800 to $4,000; Headstone / marker $1,000 to $3,000; Flowers and music $300 to $1,000.</desc>
<rect width="360" height="470" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#2b2b2b">
<text x="16" y="26" font-size="16" font-weight="700">Catholic Funeral Cost Estimates</text>
<text x="16" y="48" font-size="16" font-weight="700">(2026)</text>
<text x="16" y="76">Vigil / Wake service</text><rect x="27" y="84" width="33" height="16" rx="3" fill="#8a6d3b"/><text x="66" y="97" font-weight="600">$500–$2,000</text>
<text x="16" y="126">Funeral Mass (church offering)</text><rect x="20" y="134" width="7" height="16" rx="3" fill="#8a6d3b"/><text x="33" y="147" font-weight="600">$200–$500</text>
<text x="16" y="176">Funeral home services</text><rect x="125" y="184" width="109" height="16" rx="3" fill="#8a6d3b"/><text x="240" y="197" font-weight="600">$5,000–$10,000</text>
<text x="16" y="226">Casket</text><rect x="38" y="234" width="87" height="16" rx="3" fill="#8a6d3b"/><text x="131" y="247" font-weight="600">$1,000–$5,000</text>
<text x="16" y="276">Cemetery plot (Catholic cemetery)</text><rect x="49" y="284" width="98" height="16" rx="3" fill="#8a6d3b"/><text x="153" y="297" font-weight="600">$1,500–$6,000</text>
<text x="16" y="326">Burial vault</text><rect x="33" y="334" width="70" height="16" rx="3" fill="#8a6d3b"/><text x="109" y="347" font-weight="600">$800–$4,000</text>
<text x="16" y="376">Headstone / marker</text><rect x="38" y="384" width="43" height="16" rx="3" fill="#8a6d3b"/><text x="87" y="397" font-weight="600">$1,000–$3,000</text>
<text x="16" y="426">Flowers and music</text><rect x="23" y="434" width="15" height="16" rx="3" fill="#8a6d3b"/><text x="44" y="447" font-weight="600">$300–$1,000</text>
</g>
</svg>
