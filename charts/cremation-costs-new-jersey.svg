<g font-family="Inter, Arial, sans-serif" font-size="13" fill="#2b2b2b">
<text x="16" y="28" font-size="16" font-weight="700">New Jersey cremation estimates for 2026</text>
<line x1="230" y1="48" x2="230" y2="232" stroke="#bbbbbb"/>
<text x="222" y="67" text-anchor="end">Direct cremation</text><rect x="230" y="57" width="304" height="12" rx="3" fill="#efe7db"/><rect x="282" y="53" width="51" height="20" rx="3" fill="#8a6d3b"/><text x="668" y="67" text-anchor="end">$1,680–$3,360</text>
