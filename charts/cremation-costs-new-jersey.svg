<svg xmlns="http://www.w3.org/2000/svg" width="680" height="244" viewBox="0 0 680 244" role="img" aria-labelledby="t d">
<title id="t">New Jersey cremation estimates for 2026</title>
<desc id="d">Range chart of New Jersey cremation estimates for 2026. Direct cremation $1,680 to $3,360; Cremation with service $6,080 to $9,880; Basic urn $25 to $3,000 or more; Memorial service $0 to $5,000; Cremation jewelry $20 to $2,000 or more; Scattering service $0 to $1,500.</desc>
