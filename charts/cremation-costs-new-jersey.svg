<text x="222" y="127" text-anchor="end">Basic urn</text><rect x="230" y="117" width="304" height="12" rx="3" fill="#efe7db"/><rect x="231" y="113" width="91" height="20" rx="3" fill="#8a6d3b"/><text x="668" y="127" text-anchor="end">$25–$3,000+</text>
