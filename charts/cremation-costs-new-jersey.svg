<text x="222" y="187" text-anchor="end">Cremation jewelry</text><rect x="230" y="177" width="304" height="12" rx="3" fill="#efe7db"/><rect x="231" y="173" width="61" height="20" rx="3" fill="#8a6d3b"/><text x="668" y="187" text-anchor="end">$20–$2,000+</text>
