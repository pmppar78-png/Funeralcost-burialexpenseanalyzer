<text x="222" y="157" text-anchor="end">Casket</text><rect x="261" y="143" width="126" height="20" rx="3" fill="#8a6d3b"/><text x="393" y="157">$1,000–$5,000</text>
<text x="222" y="187" text-anchor="end">Cemetery plot (Catholic cemete…</text><rect x="277" y="173" width="141" height="20" rx="3" fill="#8a6d3b"/><text x="424" y="187">$1,500–$6,000</text>
<text x="222" y="217" text-anchor="end">Burial vault</text><rect x="255" y="203" width="101" height="20" rx="3" fill="#8a6d3b"/><text x="362" y="217">$800–$4,000</text>
<text x="222" y="247" text-anchor="end">Headstone / marker</text><rect x="261" y="233" width="63" height="20" rx="3" fill="#8a6d3b"/><text x="330" y="247">$1,000–$3,000</text>
<text x="222" y="277" text-anchor="end">Flowers and music</text><rect x="239" y="263" width="22" height="20" rx="3" fill="#8a6d3b"/><text x="267" y="277">$300–$1,000</text>
