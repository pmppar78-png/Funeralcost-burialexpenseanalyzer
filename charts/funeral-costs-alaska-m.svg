<svg xmlns="http://www.w3.org/2000/svg" width="360" height="370" viewBox="0 0 360 370" role="img" aria-labelledby="t d">
<title id="t">Alaska Funeral Cost Averages (2026)</title>
<desc id="d">Horizontal bar chart of Alaska Funeral Cost Averages (2026). Traditional funeral with burial $9,800; Funeral with cremation $7,200; Direct cremation $2,800; Cemetery / burial plot $4,500; Embalming $980; Casket $2,940.</desc>
<rect width="360" height="370" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#2b2b2b">
<text x="16" y="26" font-size="16" font-weight="700">Alaska Funeral Cost Averages</text>
<text x="16" y="48" font-size="16" font-weight="700">(2026)</text>
<text x="16" y="76">Traditional funeral with burial</text><rect x="16" y="84" width="218" height="16" rx="3" fill="#8a6d3b"/><text x="240" y="97" font-weight="600">$9,800</text>
<text x="16" y="126">Funeral with cremation</text><rect x="16" y="134" width="160" height="16" rx="3" fill="#8a6d3b"/><text x="182" y="147" font-weight="600">$7,200</text>
<text x="16" y="176">Direct cremation</text><rect x="16" y="184" width="62" height="16" rx="3" fill="#8a6d3b"/><text x="84" y="197" font-weight="600">$2,800</text>
<text x="16" y="226">Cemetery / burial plot</text><rect x="16" y="234" width="100" height="16" rx="3" fill="#8a6d3b"/><text x="122" y="247" font-weight="600">$4,500</text>
<text x="16" y="276">Embalming</text><rect x="16" y="284" width="22" height="16" rx="3" fill="#8a6d3b"/><text x="44" y="297" font-weight="600">$980</text>
<text x="16" y="326">Casket</text><rect x="16" y="334" width="65" height="16" rx="3" fill="#8a6d3b"/><text x="87" y="347" font-weight="600">$2,940</text>
</g>
</svg>
