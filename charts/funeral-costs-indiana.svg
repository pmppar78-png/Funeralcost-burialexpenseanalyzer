<svg xmlns="http://www.w3.org/2000/svg" width="680" height="244" viewBox="0 0 680 244" role="img" aria-labelledby="t d">
<title id="t">Indiana Funeral Cost Averages (2026)</title>
<desc id="d">Horizontal bar chart of Indiana Funeral Cost Averages (2026). Traditional funeral with burial $6,900; Funeral with cremation $5,600; Direct cremation $1,600; Cemetery / burial plot $3,200; Embalming $690; Casket $2,070.</desc>
<rect width="680" height="244" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="13" fill="#2b2b2b">
<text x="16" y="28" font-size="16" font-weight="700">Indiana Funeral Cost Averages (2026)</text>
<line x1="230" y1="48" x2="230" y2="232" stroke="#bbbbbb"/>
<text x="222" y="67" text-anchor="end">Traditional funeral with burial</text><rect x="230" y="53" width="314" height="20" rx="3" fill="#8a6d3b"/><text x="550" y="67">$6,900</text>
<text x="222" y="97" text-anchor="end">Funeral with cremation</text><rect x="230" y="83" width="255" height="20" rx="3" fill="#8a6d3b"/><text x="491" y="97">$5,600</text>
<text x="222" y="127" text-anchor="end">Direct cremation</text><rect x="230" y="113" width="73" height="20" rx="3" fill="#8a6d3b"/><text x="309" y="127">$1,600</text>
<text x="222" y="157" text-anchor="end">Cemetery / burial plot</text><rect x="230" y="143" width="146" height="20" rx="3" fill="#8a6d3b"/><text x="382" y="157">$3,200</text>
<text x="222" y="187" text-anchor="end">Embalming</text><rect x="230" y="173" width="31" height="20" rx="3" fill="#8a6d3b"/><text x="267" y="187">$690</text>
<text x="222" y="217" text-anchor="end">Casket</text><rect x="230" y="203" width="94" height="20" rx="3" fill="#8a6d3b"/><text x="330" y="217">$2,070</text>
</g>
</svg>
