<svg xmlns="http://www.w3.org/2000/svg" width="360" height="398" viewBox="0 0 360 398" role="img" aria-labelledby="t d">
<title id="t">Burial Costs in Delaware (2026)</title>
<desc id="d">Horizontal bar chart of Burial Costs in Delaware (2026). Funeral service $8,600; Cemetery plot $4,200; Casket $2,580; Burial vault / liner $1,680; Opening &amp; closing grave $2,100; Headstone / marker $1,500; Embalming $860.</desc>
<rect width="360" height="398" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#2b2b2b">
<text x="16" y="26" font-size="16" font-weight="700">Burial Costs in Delaware (2026)</text>
<text x="16" y="54">Funeral service</text><rect x="16" y="62" width="218" height="16" rx="3" fill="#8a6d3b"/><text x="240" y="75" font-weight="600">$8,600</text>
<text x="16" y="104">Cemetery plot</text><rect x="16" y="112" width="106" height="16" rx="3" fill="#8a6d3b"/><text x="128" y="125" font-weight="600">$4,200</text>
