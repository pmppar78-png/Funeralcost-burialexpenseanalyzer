<text x="16" y="204">Burial vault / liner</text><rect x="16" y="212" width="43" height="16" rx="3" fill="#8a6d3b"/><text x="65" y="225" font-weight="600">$1,680</text>
<text x="16" y="254">Opening &amp; closing grave</text><rect x="16" y="262" width="53" height="16" rx="3" fill="#8a6d3b"/><text x="75" y="275" font-weight="600">$2,100</text>
<text x="16" y="304">Headstone / marker</text><rect x="16" y="312" width="38" height="16" rx="3" fill="#8a6d3b"/><text x="60" y="325" font-weight="600">$1,500</text>
