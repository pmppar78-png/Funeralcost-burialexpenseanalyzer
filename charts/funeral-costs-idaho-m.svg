<svg xmlns="http://www.w3.org/2000/svg" width="360" height="348" viewBox="0 0 360 348" role="img" aria-labelledby="t d">
<title id="t">Idaho funeral estimates for 2026</title>
<desc id="d">Horizontal bar chart of Idaho funeral estimates for 2026. Traditional funeral with burial $6,700; Funeral with cremation $5,400; Direct cremation $1,500; Cemetery / burial plot $3,000; Embalming $670; Casket $2,010.</desc>
<rect width="360" height="348" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#2b2b2b">
<text x="16" y="26" font-size="16" font-weight="700">Idaho funeral estimates for 2026</text>
<text x="16" y="54">Traditional funeral with burial</text><rect x="16" y="62" width="218" height="16" rx="3" fill="#8a6d3b"/><text x="240" y="75" font-weight="600">$6,700</text>
<text x="16" y="104">Funeral with cremation</text><rect x="16" y="112" width="176" height="16" rx="3" fill="#8a6d3b"/><text x="198" y="125" font-weight="600">$5,400</text>
<text x="16" y="154">Direct cremation</text><rect x="16" y="162" width="49" height="16" rx="3" fill="#8a6d3b"/><text x="71" y="175" font-weight="600">$1,500</text>
<text x="16" y="204">Cemetery / burial plot</text><rect x="16" y="212" width="98" height="16" rx="3" fill="#8a6d3b"/><text x="120" y="225" font-weight="600">$3,000</text>
<text x="16" y="254">Embalming</text><rect x="16" y="262" width="22" height="16" rx="3" fill="#8a6d3b"/><text x="44" y="275" font-weight="600">$670</text>
<text x="16" y="304">Casket</text><rect x="16" y="312" width="65" height="16" rx="3" fill="#8a6d3b"/><text x="87" y="325" font-weight="600">$2,010</text>
</g>
</svg>
