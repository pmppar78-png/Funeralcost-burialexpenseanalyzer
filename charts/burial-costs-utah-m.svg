<text x="16" y="366">Embalming</text><text x="344" y="366" text-anchor="end" font-weight="600">$690</text><rect x="16" y="372" width="33" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="416" font-size="11" fill="#6b5a4a">$0</text><text x="344" y="416" font-size="11" fill="#6b5a4a" text-anchor="end">$6,900</text>
</g>
