<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="t d">
<title id="t">Utah burial prices, 2026 estimates</title>
<desc id="d">Horizontal bar chart of Utah burial prices, 2026 estimates. Funeral service $6,900; Cemetery plot $3,200; Casket $2,070; Burial vault / liner $1,280; Opening &amp; closing grave $1,600; Headstone / marker $1,500; Embalming $690.</desc>
<rect width="360" height="420" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#2b2b2b">
<text x="16" y="26" font-size="16" font-weight="700">Utah burial prices, 2026 estimates</text>
<text x="16" y="54">Funeral service</text><text x="344" y="54" text-anchor="end" font-weight="600">$6,900</text><rect x="16" y="60" width="328" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="106">Cemetery plot</text><text x="344" y="106" text-anchor="end" font-weight="600">$3,200</text><rect x="16" y="112" width="152" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="158">Casket</text><text x="344" y="158" text-anchor="end" font-weight="600">$2,070</text><rect x="16" y="164" width="98" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="210">Burial vault / liner</text><text x="344" y="210" text-anchor="end" font-weight="600">$1,280</text><rect x="16" y="216" width="61" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="262">Opening &amp; closing grave</text><text x="344" y="262" text-anchor="end" font-weight="600">$1,600</text><rect x="16" y="268" width="76" height="16" rx="3" fill="#8a6d3b"/>
