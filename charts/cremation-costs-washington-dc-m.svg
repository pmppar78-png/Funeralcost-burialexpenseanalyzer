<svg xmlns="http://www.w3.org/2000/svg" width="360" height="286" viewBox="0 0 360 286" role="img" aria-labelledby="t d">
<title id="t">Washington DC Cremation Costs (2026)</title>
<desc id="d">Range chart of Washington DC Cremation Costs (2026). Basic urn $50 to $300; Memorial service $500 to $2,500; Cremation jewelry $50 to $500; Scattering service $200 to $800.</desc>
<rect width="360" height="286" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#2b2b2b">
<text x="16" y="26" font-size="16" font-weight="700">Washington DC Cremation Costs</text>
<text x="16" y="48" font-size="16" font-weight="700">(2026)</text>
<text x="16" y="76">Basic urn</text><text x="344" y="76" text-anchor="end" font-weight="600">$50–$300</text><rect x="16" y="86" width="328" height="12" rx="3" fill="#efe7db"/><rect x="23" y="82" width="32" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="128">Memorial service</text><text x="344" y="128" text-anchor="end" font-weight="600">$500–$2,500</text><rect x="16" y="138" width="328" height="12" rx="3" fill="#efe7db"/><rect x="82" y="134" width="262" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="180">Cremation jewelry</text><text x="344" y="180" text-anchor="end" font-weight="600">$50–$500</text><rect x="16" y="190" width="328" height="12" rx="3" fill="#efe7db"/><rect x="23" y="186" width="59" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="232">Scattering service</text><text x="344" y="232" text-anchor="end" font-weight="600">$200–$800</text><rect x="16" y="242" width="328" height="12" rx="3" fill="#efe7db"/><rect x="42" y="238" width="79" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="282" font-size="11" fill="#6b5a4a">$0</text><text x="344" y="282" font-size="11" fill="#6b5a4a" text-anchor="end">$2,500</text>
</g>
