<svg xmlns="http://www.w3.org/2000/svg" width="360" height="370" viewBox="0 0 360 370" role="img" aria-labelledby="t d">
<title id="t">Funeral Costs by State: What Families Actually Pay in 2026</title>
<desc id="d">Range chart of Funeral Costs by State: What Families Actually Pay in 2026. Northeast (NY, NJ, MA, CT, PA) $6,375 to $14,040; Southeast (FL, GA, NC, SC, VA) $5,025 to $10,660; Midwest (OH, IL, MI, IN, WI) $5,175 to $11,050; South (TX, LA, OK, AR, MS, AL) $4,425 to $9,360; West (CA, WA, OR, HI) $6,150 to $14,300; Mountain (AZ, NV, UT, CO, NM, ID, MT) $4,800 to $10,400.</desc>
<rect width="360" height="370" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#2b2b2b">
<text x="16" y="26" font-size="16" font-weight="700">Funeral Costs by State: What</text>
<text x="16" y="48" font-size="16" font-weight="700">Families Actually Pay in 2026</text>
<text x="16" y="76">Northeast (NY, NJ, MA, CT, PA)</text><rect x="113" y="84" width="117" height="16" rx="3" fill="#8a6d3b"/><text x="236" y="97" font-weight="600">$6,375–$14,040</text>
<text x="16" y="126">Southeast (FL, GA, NC, SC, VA)</text><rect x="93" y="134" width="86" height="16" rx="3" fill="#8a6d3b"/><text x="185" y="147" font-weight="600">$5,025–$10,660</text>
<text x="16" y="176">Midwest (OH, IL, MI, IN, WI)</text><rect x="95" y="184" width="89" height="16" rx="3" fill="#8a6d3b"/><text x="190" y="197" font-weight="600">$5,175–$11,050</text>
