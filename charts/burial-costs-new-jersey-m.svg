<svg xmlns="http://www.w3.org/2000/svg" width="360" height="398" viewBox="0 0 360 398" role="img" aria-labelledby="t d">
<title id="t">Burial Costs in New Jersey (2026)</title>
<desc id="d">Horizontal bar chart of Burial Costs in New Jersey (2026). Funeral service $10,200; Cemetery plot $5,000; Casket $3,060; Burial vault / liner $2,000; Opening &amp; closing grave $2,500; Headstone / marker $1,500; Embalming $1,020.</desc>
<rect width="360" height="398" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#2b2b2b">
<text x="16" y="26" font-size="16" font-weight="700">Burial Costs in New Jersey (2026)</text>
<text x="16" y="54">Funeral service</text><rect x="16" y="62" width="218" height="16" rx="3" fill="#8a6d3b"/><text x="240" y="75" font-weight="600">$10,200</text>
<text x="16" y="104">Cemetery plot</text><rect x="16" y="112" width="107" height="16" rx="3" fill="#8a6d3b"/><text x="129" y="125" font-weight="600">$5,000</text>
<text x="16" y="154">Casket</text><rect x="16" y="162" width="65" height="16" rx="3" fill="#8a6d3b"/><text x="87" y="175" font-weight="600">$3,060</text>
<text x="16" y="204">Burial vault / liner</text><rect x="16" y="212" width="43" height="16" rx="3" fill="#8a6d3b"/><text x="65" y="225" font-weight="600">$2,000</text>
<text x="16" y="254">Opening &amp; closing grave</text><rect x="16" y="262" width="53" height="16" rx="3" fill="#8a6d3b"/><text x="75" y="275" font-weight="600">$2,500</text>
<text x="16" y="304">Headstone / marker</text><rect x="16" y="312" width="32" height="16" rx="3" fill="#8a6d3b"/><text x="54" y="325" font-weight="600">$1,500</text>
<text x="16" y="354">Embalming</text><rect x="16" y="362" width="22" height="16" rx="3" fill="#8a6d3b"/><text x="44" y="375" font-weight="600">$1,020</text>
</g>
</svg>
