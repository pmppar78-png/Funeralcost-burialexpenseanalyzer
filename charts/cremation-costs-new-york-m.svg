<svg xmlns="http://www.w3.org/2000/svg" width="360" height="348" viewBox="0 0 360 348" role="img" aria-labelledby="t d">
<title id="t">New York cremation estimates, 2026</title>
<desc id="d">Range chart of New York cremation estimates, 2026. Direct cremation $1,820 to $3,640; Cremation with service $6,400 to $10,400; Basic urn $25 to $3,000 or more; Memorial service $0 to $5,000; Cremation jewelry $20 to $2,000 or more; Scattering service $0 to $1,500.</desc>
<rect width="360" height="348" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#2b2b2b">
<text x="16" y="26" font-size="16" font-weight="700">New York cremation estimates, 2026</text>
<text x="16" y="54">Direct cremation</text><rect x="54" y="62" width="38" height="16" rx="3" fill="#8a6d3b"/><text x="98" y="75" font-weight="600">$1,820–$3,640</text>
<text x="16" y="104">Cremation with service</text><rect x="150" y="112" width="84" height="16" rx="3" fill="#8a6d3b"/><text x="240" y="125" font-weight="600">$6,400–$10,400</text>
<text x="16" y="154">Basic urn</text><rect x="17" y="162" width="62" height="16" rx="3" fill="#8a6d3b"/><text x="85" y="175" font-weight="600">$25–$3,000+</text>
<text x="16" y="204">Memorial service</text><rect x="16" y="212" width="105" height="16" rx="3" fill="#8a6d3b"/><text x="127" y="225" font-weight="600">$0–$5,000</text>
<text x="16" y="254">Cremation jewelry</text><rect x="16" y="262" width="42" height="16" rx="3" fill="#8a6d3b"/><text x="64" y="275" font-weight="600">$20–$2,000+</text>
<text x="16" y="304">Scattering service</text><rect x="16" y="312" width="31" height="16" rx="3" fill="#8a6d3b"/><text x="53" y="325" font-weight="600">$0–$1,500</text>
</g>
</svg>
