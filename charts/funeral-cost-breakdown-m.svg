<svg xmlns="http://www.w3.org/2000/svg" width="360" height="470" viewBox="0 0 360 470" role="img" aria-labelledby="t d">
<title id="t">Funeral Cost Breakdown: Every Fee Explained Line by Line</title>
<desc id="d">Range chart of Funeral Cost Breakdown: Every Fee Explained Line by Line. Basic services fee (non-declinable) $2,000 to $3,500; Embalming $500 to $1,000; Body preparation (no embalming) $200 to $400; Use of facilities for viewing $400 to $800; Use of facilities for ceremony $400 to $800; Hearse / funeral coach $300 to $500; Service car / limousine $150 to $400; Transfer of remains $200 to $500.</desc>
<rect width="360" height="470" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#2b2b2b">
<text x="16" y="26" font-size="16" font-weight="700">Funeral Cost Breakdown: Every Fee</text>
<text x="16" y="48" font-size="16" font-weight="700">Explained Line by Line</text>
<text x="16" y="76">Basic services fee (non-declinable)</text><rect x="141" y="84" width="93" height="16" rx="3" fill="#8a6d3b"/><text x="240" y="97" font-weight="600">$2,000–$3,500</text>
<text x="16" y="126">Embalming</text><rect x="47" y="134" width="31" height="16" rx="3" fill="#8a6d3b"/><text x="84" y="147" font-weight="600">$500–$1,000</text>
<text x="16" y="176">Body preparation (no embalming)</text><rect x="28" y="184" width="13" height="16" rx="3" fill="#8a6d3b"/><text x="47" y="197" font-weight="600">$200–$400</text>
<text x="16" y="226">Use of facilities for viewing</text><rect x="41" y="234" width="25" height="16" rx="3" fill="#8a6d3b"/><text x="72" y="247" font-weight="600">$400–$800</text>
<text x="16" y="276">Use of facilities for ceremony</text><rect x="41" y="284" width="25" height="16" rx="3" fill="#8a6d3b"/><text x="72" y="297" font-weight="600">$400–$800</text>
<text x="16" y="326">Hearse / funeral coach</text><rect x="35" y="334" width="12" height="16" rx="3" fill="#8a6d3b"/><text x="53" y="347" font-weight="600">$300–$500</text>
<text x="16" y="376">Service car / limousine</text><rect x="25" y="384" width="16" height="16" rx="3" fill="#8a6d3b"/><text x="47" y="397" font-weight="600">$150–$400</text>
<text x="16" y="426">Transfer of remains</text><rect x="28" y="434" width="19" height="16" rx="3" fill="#8a6d3b"/><text x="53" y="447" font-weight="600">$200–$500</text>
</g>
</svg>
