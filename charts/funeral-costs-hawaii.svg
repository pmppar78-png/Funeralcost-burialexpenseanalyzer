<svg xmlns="http://www.w3.org/2000/svg" width="680" height="244" viewBox="0 0 680 244" role="img" aria-labelledby="t d">
<title id="t">What a Hawaii funeral costs (2026 estimates)</title>
<desc id="d">Horizontal bar chart of What a Hawaii funeral costs (2026 estimates). Traditional funeral with burial $11,000; Funeral with cremation $8,200; Direct cremation $3,000; Cemetery / burial plot $5,500; Embalming $1,100; Casket $3,300.</desc>
<rect width="680" height="244" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="13" fill="#2b2b2b">
<text x="16" y="28" font-size="16" font-weight="700">What a Hawaii funeral costs (2026 estimates)</text>
<line x1="230" y1="48" x2="230" y2="232" stroke="#bbbbbb"/>
<text x="222" y="67" text-anchor="end">Traditional funeral with burial</text><rect x="230" y="53" width="314" height="20" rx="3" fill="#8a6d3b"/><text x="550" y="67">$11,000</text>
<text x="222" y="97" text-anchor="end">Funeral with cremation</text><rect x="230" y="83" width="234" height="20" rx="3" fill="#8a6d3b"/><text x="470" y="97">$8,200</text>
<text x="222" y="127" text-anchor="end">Direct cremation</text><rect x="230" y="113" width="86" height="20" rx="3" fill="#8a6d3b"/><text x="322" y="127">$3,000</text>
<text x="222" y="157" text-anchor="end">Cemetery / burial plot</text><rect x="230" y="143" width="157" height="20" rx="3" fill="#8a6d3b"/><text x="393" y="157">$5,500</text>
<text x="222" y="187" text-anchor="end">Embalming</text><rect x="230" y="173" width="31" height="20" rx="3" fill="#8a6d3b"/><text x="267" y="187">$1,100</text>
<text x="222" y="217" text-anchor="end">Casket</text><rect x="230" y="203" width="94" height="20" rx="3" fill="#8a6d3b"/><text x="330" y="217">$3,300</text>
</g>
</svg>
