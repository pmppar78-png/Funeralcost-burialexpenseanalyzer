<svg xmlns="http://www.w3.org/2000/svg" width="360" height="348" viewBox="0 0 360 348" role="img" aria-labelledby="t d">
<title id="t">Cremation Costs in Alaska (2026)</title>
<desc id="d">Range chart of Cremation Costs in Alaska (2026). Direct cremation $1,960 to $3,920; Cremation with service $5,760 to $9,360; Basic urn $25 to $3,000 or more; Memorial service $0 to $5,000; Cremation jewelry $20 to $2,000 or more; Scattering service $0 to $1,500.</desc>
<rect width="360" height="348" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#2b2b2b">
<text x="16" y="26" font-size="16" font-weight="700">Cremation Costs in Alaska (2026)</text>
<text x="16" y="54">Direct cremation</text><rect x="62" y="62" width="45" height="16" rx="3" fill="#8a6d3b"/><text x="113" y="75" font-weight="600">$1,960–$3,920</text>
<text x="16" y="104">Cremation with service</text><rect x="150" y="112" width="84" height="16" rx="3" fill="#8a6d3b"/><text x="240" y="125" font-weight="600">$5,760–$9,360</text>
<text x="16" y="154">Basic urn</text><rect x="17" y="162" width="69" height="16" rx="3" fill="#8a6d3b"/><text x="92" y="175" font-weight="600">$25–$3,000+</text>
<text x="16" y="204">Memorial service</text><rect x="16" y="212" width="116" height="16" rx="3" fill="#8a6d3b"/><text x="138" y="225" font-weight="600">$0–$5,000</text>
<text x="16" y="254">Cremation jewelry</text><rect x="16" y="262" width="47" height="16" rx="3" fill="#8a6d3b"/><text x="69" y="275" font-weight="600">$20–$2,000+</text>
<text x="16" y="304">Scattering service</text><rect x="16" y="312" width="35" height="16" rx="3" fill="#8a6d3b"/><text x="57" y="325" font-weight="600">$0–$1,500</text>
</g>
</svg>
