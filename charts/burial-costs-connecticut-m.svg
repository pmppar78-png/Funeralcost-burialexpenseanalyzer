<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="t d">
<title id="t">Burial Costs in Connecticut (2026)</title>
<desc id="d">Horizontal bar chart of Burial Costs in Connecticut (2026). Funeral service $10,200; Cemetery plot $5,000; Casket $3,060; Burial vault / liner $2,000; Opening &amp; closing grave $2,500; Headstone / marker $1,500; Embalming $1,020.</desc>
<rect width="360" height="420" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#2b2b2b">
<text x="16" y="26" font-size="16" font-weight="700">Burial Costs in Connecticut (2026)</text>
<text x="16" y="54">Funeral service</text><text x="344" y="54" text-anchor="end" font-weight="600">$10,200</text><rect x="16" y="60" width="328" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="106">Cemetery plot</text><text x="344" y="106" text-anchor="end" font-weight="600">$5,000</text><rect x="16" y="112" width="161" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="158">Casket</text><text x="344" y="158" text-anchor="end" font-weight="600">$3,060</text><rect x="16" y="164" width="98" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="210">Burial vault / liner</text><text x="344" y="210" text-anchor="end" font-weight="600">$2,000</text><rect x="16" y="216" width="64" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="262">Opening &amp; closing grave</text><text x="344" y="262" text-anchor="end" font-weight="600">$2,500</text><rect x="16" y="268" width="80" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="314">Headstone / marker</text><text x="344" y="314" text-anchor="end" font-weight="600">$1,500</text><rect x="16" y="320" width="48" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="366">Embalming</text><text x="344" y="366" text-anchor="end" font-weight="600">$1,020</text><rect x="16" y="372" width="33" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="416" font-size="11" fill="#6b5a4a">$0</text><text x="344" y="416" font-size="11" fill="#6b5a4a" text-anchor="end">$10,200</text>
