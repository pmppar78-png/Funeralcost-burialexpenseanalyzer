<svg xmlns="http://www.w3.org/2000/svg" width="360" height="348" viewBox="0 0 360 348" role="img" aria-labelledby="t d">
<title id="t">Minnesota estimates, 2026</title>
<desc id="d">Horizontal bar chart of Minnesota estimates, 2026. Traditional funeral with burial $7,700; Funeral with cremation $6,000; Direct cremation $1,800; Cemetery / burial plot $3,600; Embalming $770; Casket $2,310.</desc>
<rect width="360" height="348" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#2b2b2b">
<text x="16" y="26" font-size="16" font-weight="700">Minnesota estimates, 2026</text>
<text x="16" y="54">Traditional funeral with burial</text><rect x="16" y="62" width="218" height="16" rx="3" fill="#8a6d3b"/><text x="240" y="75" font-weight="600">$7,700</text>
<text x="16" y="104">Funeral with cremation</text><rect x="16" y="112" width="170" height="16" rx="3" fill="#8a6d3b"/><text x="192" y="125" font-weight="600">$6,000</text>
