<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="t d">
<title id="t">Jewish Funeral Cost Estimates (2026)</title>
<desc id="d">Range chart of Jewish Funeral Cost Estimates (2026). Simple wood casket $500 to $2,000; Funeral home services $3,000 to $7,000; Jewish cemetery plot $2,000 to $8,000; Rabbi / officiant $300 to $800; Burial (opening/closing) $800 to $2,000; Headstone / unveiling $1,000 to $4,000; Shiva expenses $200 to $1,000.</desc>
<rect width="360" height="420" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#2b2b2b">
<text x="16" y="26" font-size="16" font-weight="700">Jewish Funeral Cost Estimates</text>
<text x="16" y="48" font-size="16" font-weight="700">(2026)</text>
<text x="16" y="76">Simple wood casket</text><rect x="30" y="84" width="41" height="16" rx="3" fill="#8a6d3b"/><text x="77" y="97" font-weight="600">$500–$2,000</text>
<text x="16" y="126">Funeral home services</text><rect x="98" y="134" width="109" height="16" rx="3" fill="#8a6d3b"/><text x="213" y="147" font-weight="600">$3,000–$7,000</text>
<text x="16" y="176">Jewish cemetery plot</text><rect x="71" y="184" width="163" height="16" rx="3" fill="#8a6d3b"/><text x="240" y="197" font-weight="600">$2,000–$8,000</text>
<text x="16" y="226">Rabbi / officiant</text><rect x="24" y="234" width="14" height="16" rx="3" fill="#8a6d3b"/><text x="44" y="247" font-weight="600">$300–$800</text>
<text x="16" y="276">Burial (opening/closing)</text><rect x="38" y="284" width="33" height="16" rx="3" fill="#8a6d3b"/><text x="77" y="297" font-weight="600">$800–$2,000</text>
<text x="16" y="326">Headstone / unveiling</text><rect x="43" y="334" width="82" height="16" rx="3" fill="#8a6d3b"/><text x="131" y="347" font-weight="600">$1,000–$4,000</text>
<text x="16" y="376">Shiva expenses</text><rect x="21" y="384" width="22" height="16" rx="3" fill="#8a6d3b"/><text x="49" y="397" font-weight="600">$200–$1,000</text>
</g>
</svg>
