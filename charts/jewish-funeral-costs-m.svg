<svg xmlns="http://www.w3.org/2000/svg" width="360" height="442" viewBox="0 0 360 442" role="img" aria-labelledby="t d">
<title id="t">Jewish Funeral Cost Estimates (2026)</title>
<desc id="d">Range chart of Jewish Funeral Cost Estimates (2026). Simple wood casket $500 to $2,000; Funeral home services $3,000 to $7,000; Jewish cemetery plot $2,000 to $8,000; Rabbi / officiant $300 to $800; Burial (opening/closing) $800 to $2,000; Headstone / unveiling $1,000 to $4,000; Shiva expenses $200 to $1,000.</desc>
<rect width="360" height="442" fill="#ffffff"/>
<g font-family="Inter, Arial, sans-serif" font-size="14" fill="#2b2b2b">
<text x="16" y="26" font-size="16" font-weight="700">Jewish Funeral Cost Estimates</text>
<text x="16" y="48" font-size="16" font-weight="700">(2026)</text>
<text x="16" y="76">Simple wood casket</text><text x="344" y="76" text-anchor="end" font-weight="600">$500–$2,000</text><rect x="16" y="86" width="328" height="12" rx="3" fill="#efe7db"/><rect x="37" y="82" width="61" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="128">Funeral home services</text><text x="344" y="128" text-anchor="end" font-weight="600">$3,000–$7,000</text><rect x="16" y="138" width="328" height="12" rx="3" fill="#efe7db"/><rect x="139" y="134" width="164" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="180">Jewish cemetery plot</text><text x="344" y="180" text-anchor="end" font-weight="600">$2,000–$8,000</text><rect x="16" y="190" width="328" height="12" rx="3" fill="#efe7db"/><rect x="98" y="186" width="246" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="232">Rabbi / officiant</text><text x="344" y="232" text-anchor="end" font-weight="600">$300–$800</text><rect x="16" y="242" width="328" height="12" rx="3" fill="#efe7db"/><rect x="28" y="238" width="21" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="284">Burial (opening/closing)</text><text x="344" y="284" text-anchor="end" font-weight="600">$800–$2,000</text><rect x="16" y="294" width="328" height="12" rx="3" fill="#efe7db"/><rect x="49" y="290" width="49" height="16" rx="3" fill="#8a6d3b"/>
<text x="16" y="336">Headstone / unveiling</text><text x="344" y="336" text-anchor="end" font-weight="600">$1,000–$4,000</text><rect x="16" y="346" width="328" height="12" rx="3" fill="#efe7db"/><rect x="57" y="342" width="123" height="16" rx="3" fill="#8a6d3b"/>
